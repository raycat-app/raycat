[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/raycat-app/raycat"
authors = ["Авторы raycat"]
publish = false

[workspace.dependencies]
anyhow = "1"
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
brotli-decompressor = "5"
clap = { version = "4.6", default-features = false, features = [
  "std",
  "derive",
  "help",
  "usage",
  "error-context",
  "color",
  "wrap_help",
] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
libc = "0.2"
raycat-config = { path = "crates/config" }
raycat-emulation = { path = "crates/emulation" }
raycat-http = { path = "crates/http" }
raycat-subscription = { path = "crates/subscription" }
raycat-xray = { path = "crates/xray" }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
ruzstd = { version = "0.9", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = [
  "rt",
  "time",
  "signal",
  "process",
  "sync",
  "macros",
  "io-util",
] }
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
webpki-roots = "1"

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stderr = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
