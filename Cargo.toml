[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/raycat-app/raycat"
authors = ["Авторы raycat"]
publish = false

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
base64 = { version = "0.23", default-features = false, features = ["alloc"] }
brotli-decompressor = "6"
clap = { version = "4.6", default-features = false, features = [
  "std",
  "derive",
  "help",
  "usage",
  "error-context",
  "color",
  "wrap_help",
] }
clap_complete = { version = "4.6", default-features = false }
clap_mangen = { version = "0.3", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
libc = "0.2"
prost = "0.14"
protox = "0.9"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
raycat-config = { path = "crates/config" }
raycat-emulation = { path = "crates/emulation" }
raycat-http = { path = "crates/http" }
raycat-netfilter = { path = "crates/netfilter" }
raycat-proto = { path = "crates/proto" }
raycat-select = { path = "crates/select" }
raycat-subscription = { path = "crates/subscription" }
raycat-xray = { path = "crates/xray" }
raycat-xray-api = { path = "crates/xray-api" }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
ruzstd = { version = "0.9", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = [
  "rt",
  "time",
  "signal",
  "process",
  "sync",
  "macros",
  "io-util",
  "net",
] }
tokio-stream = { version = "0.1", default-features = false, features = ["sync"] }
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
tonic = { version = "0.14", default-features = false, features = ["channel", "codegen"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
webpki-roots = "1"

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stderr = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# Сборка для проверок в PR: тот же код и те же настройки, но без полного LTO.
# Публикуемые артефакты на main собирает профиль release.
[profile.ci]
inherits = "release"
lto = "thin"
codegen-units = 16
