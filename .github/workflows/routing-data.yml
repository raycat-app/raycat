name: Подсети РФ для маршрутизации

# Раз в неделю скачивает статистику RIPE NCC, пересобирает crates/routing/data/ru-ipv4.txt
# инструментом update-ru-ipv4 и открывает PR бота с меткой «маршрутизация». Обязательные
# проверки идут на PR сами (PR открыт токеном приложения, как в client-update.yml), бот ждёт
# «Итог» и «Заголовок PR» и сливает PR. Если число подсетей изменилось больше чем на 20 %,
# PR не сливается сам: такой скачок почти всегда означает ошибку источника. Ручной запуск с dry_run только
# собирает файл в артефакт ru-ipv4 и не создаёт ветку. Если проверки упали, заводится issue
# «Не удалось обновить подсети РФ» (одно, при повторе сбоя обновляется комментарий), а после
# слияния он закрывается.

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Только собрать файл в артефакт ru-ipv4, без ветки и PR
        type: boolean
        default: false

permissions: {}

concurrency:
  group: routing-data
  cancel-in-progress: false

jobs:
  update:
    name: Подсети и PR
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pr: ${{ steps.pr.outputs.number }}
      sha: ${{ steps.commit.outputs.sha }}
      branch: ${{ steps.commit.outputs.branch }}
      jump: ${{ steps.build.outputs.jump }}
      date: ${{ steps.build.outputs.date }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Статистика RIPE NCC
        env:
          SOURCE: https://ftp.ripe.net/pub/stats/ripencc/delegated-ripencc-extended-latest
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/delegated" "$SOURCE"
          [ -s "$RUNNER_TEMP/delegated" ] || { echo "::error::пустой файл статистики"; exit 1; }
          grep -F 'ripencc|*|ipv4|*|' "$RUNNER_TEMP/delegated" | grep -qF '|summary' || { echo "::error::в статистике нет строки summary для ipv4"; exit 1; }
      - name: Подсети и изменения
        id: build
        run: |
          file=crates/routing/data/ru-ipv4.txt
          old=$(grep -vc '^#' "$file" || true)
          cargo run --locked --quiet -p raycat-routing --features tool --bin update-ru-ipv4 -- "$RUNNER_TEMP/delegated" "$file"
          new=$(grep -vc '^#' "$file" || true)
          date=$(sed -n 's/^# Снимок: //p' "$file")
          [[ "$date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::дата снимка не прочитана"; exit 1; }
          changed=false
          if [ -n "$(git status --porcelain -- crates/routing/data)" ]; then
            changed=true
          fi
          jump=false
          if [ "$old" -eq 0 ] || [ $((new * 100)) -gt $((old * 120)) ] || [ $((new * 100)) -lt $((old * 80)) ]; then
            jump=true
          fi
          {
            echo "changed=$changed"
            echo "jump=$jump"
            echo "date=$date"
            echo "old=$old"
            echo "new=$new"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Подсети РФ"
            echo
            echo "- снимок: $date"
            echo "- подсетей было: $old, стало: $new"
            echo "- изменилось: $changed, скачок больше 20 %: $jump"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Артефакт (dry_run)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ru-ipv4
          path: crates/routing/data/ru-ipv4.txt
          if-no-files-found: error
          retention-days: 14
      # Ветку, PR и слияние бот делает токеном приложения: в отличие от событий
      # GITHUB_TOKEN, его события запускают обычные проверки PR и CI на main после слияния.
      - id: app
        if: ${{ steps.build.outputs.changed == 'true' && !inputs.dry_run }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - name: Коммит и ветка бота
        id: commit
        if: ${{ steps.build.outputs.changed == 'true' && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          DATE: ${{ steps.build.outputs.date }}
          OLD: ${{ steps.build.outputs.old }}
          NEW: ${{ steps.build.outputs.new }}
          JUMP: ${{ steps.build.outputs.jump }}
        run: |
          [[ "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::дата снимка не прочитана"; exit 1; }
          branch="bot/routing-data-$DATE"
          title="chore: подсети РФ для маршрутизации $DATE"
          {
            echo "Список подсетей РФ обновлён по статистике RIPE NCC."
            echo
            echo "- снимок: $DATE"
            echo "- подсетей: $OLD -> $NEW"
            echo "- прогон: $RUN_URL"
            if [ "$JUMP" = true ]; then
              echo
              echo "Число подсетей изменилось больше чем на 20 %. Слияние не выполнено автоматически: проверьте источник и сольите PR вручную."
            fi
          } > "$RUNNER_TEMP/body.md"
          { echo "$title"; echo; cat "$RUNNER_TEMP/body.md"; } > "$RUNNER_TEMP/message.txt"
          git config user.name sleepyhead-dev
          git config user.email 184401951+sleepyhead-dev@users.noreply.github.com
          git switch -c "$branch"
          git add crates/routing/data
          git commit -q -F "$RUNNER_TEMP/message.txt"
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push --force origin "$branch"
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "branch=$branch"
            echo "title=$title"
          } >> "$GITHUB_OUTPUT"
      - name: Pull request
        id: pr
        if: ${{ steps.build.outputs.changed == 'true' && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BRANCH: ${{ steps.commit.outputs.branch }}
          TITLE: ${{ steps.commit.outputs.title }}
        run: |
          number=$(gh pr list -R "$REPO" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" -R "$REPO" --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"
          else
            base=$(gh api "repos/$REPO" --jq .default_branch)
            if ! output=$(gh pr create -R "$REPO" --base "$base" --head "$BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/body.md" --label маршрутизация 2>&1); then
              printf '%s\n' "$output"
              echo "::error::PR не создан, ветка $BRANCH отправлена"
              exit 1
            fi
            number=$(printf '%s\n' "$output" | tail -n 1)
            number=${number##*/}
          fi
          [[ "$number" =~ ^[0-9]+$ ]] || { echo "::error::номер PR не определён"; exit 1; }
          echo "number=$number" >> "$GITHUB_OUTPUT"
      - name: Комментарий о скачке
        if: ${{ steps.pr.outputs.number != '' && steps.build.outputs.jump == 'true' }}
        env:
          PR: ${{ steps.pr.outputs.number }}
          OLD: ${{ steps.build.outputs.old }}
          NEW: ${{ steps.build.outputs.new }}
        run: |
          gh pr comment "$PR" -R "$REPO" --body "Число подсетей изменилось с $OLD на $NEW, то есть больше чем на 20 %. Резкий скачок обычно означает ошибку источника, поэтому PR не сливается автоматически. Проверьте статистику RIPE NCC и сольите PR вручную, если изменение верное."

  verify:
    name: Проверки и слияние
    needs: update
    if: ${{ needs.update.outputs.pr != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      checks: read
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ needs.update.outputs.pr }}
      SHA: ${{ needs.update.outputs.sha }}
      BRANCH: ${{ needs.update.outputs.branch }}
    steps:
      # Ветку, PR и слияние бот делает токеном приложения: в отличие от событий
      # GITHUB_TOKEN, его события запускают обычные проверки PR и CI на main после слияния.
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - name: Ожидание проверок PR
        run: |
          # PR открыт токеном приложения, на нём идут обычные проверки. Бот ждёт
          # обязательные из ruleset — «Заголовок PR» и «Итог» — на своём коммите.
          state() {
            gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" |
              jq -r --arg name "$1" '[.check_runs[] | select(.name == $name)] | sort_by(.started_at) | last | if . == null then "нет" else "\(.status) \(.conclusion)" end'
          }
          for _ in $(seq 1 160); do
            title=$(state "Заголовок PR")
            total=$(state "Итог")
            echo "Заголовок PR: $title; Итог: $total"
            if [[ $title == completed* && $total == completed* ]]; then
              [ "$title" = "completed success" ] && [ "$total" = "completed success" ]
              exit
            fi
            sleep 30
          done
          echo "::error::проверки PR не закончились за 80 минут"
          exit 1
      - name: Слияние
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        if: ${{ needs.update.outputs.jump != 'true' }}
        run: |
          title=$(gh pr view "$PR" -R "$REPO" --json title --jq .title)
          body=$(gh pr view "$PR" -R "$REPO" --json body --jq .body)
          gh pr merge "$PR" -R "$REPO" --squash --delete-branch --match-head-commit "$SHA" --subject "$title (#$PR)" --body "$body"
      - name: Слияние отключено скачком
        if: ${{ needs.update.outputs.jump == 'true' }}
        run: echo "::notice::проверки зелёные, но число подсетей изменилось больше чем на 20 %, PR $PR остаётся открытым"

  report:
    name: Отчёт об ошибке
    needs: [update, verify]
    if: ${{ always() && !inputs.dry_run && (needs.update.result == 'failure' || needs.verify.result == 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      DATE: ${{ needs.update.outputs.date }}
      PR: ${{ needs.update.outputs.pr }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Issue
        run: |
          title="Не удалось обновить подсети РФ"
          {
            echo "Автоматическое обновление подсетей РФ не дошло до слияния."
            echo
            if [ -n "$DATE" ]; then
              echo "- снимок: $DATE"
            fi
            if [ -n "$PR" ]; then
              echo "- PR: #$PR"
            fi
            echo "- прогон: $RUN_URL"
          } > body.md
          existing=$(gh issue list -R "$REPO" --state open --label маршрутизация --json number,title |
            jq -r --arg title "$title" '[.[] | select(.title == $title)][0].number // empty')
          if [ -n "$existing" ]; then
            last=$(gh issue view "$existing" -R "$REPO" --json comments --jq '.comments | last | .author.login // ""')
            if [ "$last" = github-actions ]; then
              gh issue comment "$existing" -R "$REPO" --edit-last --body-file body.md
            else
              gh issue comment "$existing" -R "$REPO" --body-file body.md
            fi
          else
            gh issue create -R "$REPO" --title "$title" --body-file body.md --label маршрутизация --label ci
          fi

  close:
    name: Закрытие issue
    needs: [update, verify]
    if: ${{ !inputs.dry_run && needs.update.result == 'success' && needs.update.outputs.jump != 'true' && (needs.verify.result == 'success' || needs.verify.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      DATE: ${{ needs.update.outputs.date }}
    steps:
      - name: Закрытие issue
        run: |
          gh issue list -R "$REPO" --state open --label маршрутизация --limit 200 --json number,title > "$RUNNER_TEMP/issues.json"
          jq -r '.[] | select(.title == "Не удалось обновить подсети РФ") | .number' "$RUNNER_TEMP/issues.json" > "$RUNNER_TEMP/close.txt"
          while read -r number; do
            gh issue close "$number" -R "$REPO" --comment "Подсети РФ актуальны на $DATE, закрываю."
          done < "$RUNNER_TEMP/close.txt"
