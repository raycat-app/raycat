name: Бенчмарк xray

# Сравнение версий xray по скорости, нагрузке на процессор и памяти (скрипт
# .github/bench/bench.sh). Запускается вручную; результаты — в сводке запуска.

on:
  workflow_dispatch:
    inputs:
      versions:
        description: Версии xray через пробел
        default: "26.3.27 26.9.30"
      xray_build:
        description: "noaes — к версиям добавляется сборка xray для процессоров без AES из versions.toml (только arm64)"
        type: choice
        options: [release, noaes]
        default: release
      size_mib:
        description: Объём одного скачивания, МиБ
        default: "500"
      godebug:
        description: Значение GODEBUG для всех процессов замера (например, cpu.aes=off для железа без AES), пусто — не задавать
        default: ""

permissions: {}

jobs:
  bench:
    name: Замер (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x86_64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    env:
      VERSIONS: ${{ inputs.versions }}
      XRAY_BUILD: ${{ inputs.xray_build }}
      SIZE_MIB: ${{ inputs.size_mib }}
      OUT_DIR: bench-out
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Сборка xray для процессоров без AES
        id: noaes
        if: ${{ inputs.xray_build == 'noaes' && matrix.arch == 'arm64' }}
        run: |
          bash .github/build/docker-args.sh aarch64 Xray-linux-arm64-v8a.zip noaes > "$RUNNER_TEMP/docker-args.txt"
          mapfile -t args < "$RUNNER_TEMP/docker-args.txt"
          docker build "${args[@]}" --target xray-noaes --output "type=local,dest=$RUNNER_TEMP/noaes" .
          echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' versions.toml)" >> "$GITHUB_OUTPUT"
      - name: Замер
        env:
          NOAES_BIN: ${{ runner.temp }}/noaes/out/xray
          NOAES_VERSION: ${{ steps.noaes.outputs.version }}
          GODEBUG: ${{ inputs.godebug }}
        run: bash .github/bench/bench.sh
      - name: Сводка
        run: bash .github/bench/bench.sh summary "$OUT_DIR" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-${{ matrix.arch }}
          path: bench-out
          retention-days: 14
          if-no-files-found: error

  summary:
    name: Итоговая таблица
    needs: bench
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bench-*
          path: bench-results
      - name: Сводка
        run: bash .github/bench/bench.sh summary bench-results/* >> "$GITHUB_STEP_SUMMARY"
