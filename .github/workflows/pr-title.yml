name: Заголовок PR

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  title:
    name: Заголовок PR
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          subjectPattern: ^[^A-ZА-ЯЁ].+$
          subjectPatternError: |
            Описание после типа начинается со строчной буквы: «feat: автопереключение узлов».
      - name: Без соавторов
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          found=$( {
            gh api "repos/$REPO/pulls/$PR" --jq '.body // ""'
            gh api "repos/$REPO/pulls/$PR/commits" --paginate --jq '.[].commit.message'
          } | grep -i '^[[:space:]]*co-authored-by:' || true)
          if [ -n "$found" ]; then
            echo "::error::В описании PR или сообщениях коммитов есть запрещённые строки:"
            printf '%s\n' "$found"
            exit 1
          fi
