name: Обновление профиля клиента

# Один клиент (приложение и платформа): захват настоящего приложения нужной версии,
# обновление профиля инструментом update-profiles, PR бота, обязательные проверки и
# слияние. Если что-то не вышло, заводится issue (одно на версию), а после слияния закрываются
# открытые issue этого клиента любой версии. Вызывается из clients.yml.
#
# Ветку, PR и слияние бот делает токеном приложения (vars.RELEASE_APP_CLIENT_ID,
# secrets.RELEASE_APP_KEY): его события, в отличие от GITHUB_TOKEN, запускают обычные проверки PR.
# Бот ждёт обязательные проверки ruleset («Итог» и «Заголовок PR») и сливает PR; слияние само
# запускает CI на main и dev-выпуск.

on:
  workflow_call:
    inputs:
      app:
        description: Приложение (happ или incy)
        type: string
        required: true
      platform:
        description: Платформа (windows или android)
        type: string
        required: true
      release:
        description: Тег релиза, из которого брать приложение
        type: string
        required: true
      merge:
        description: Сливать PR после зелёных проверок
        type: boolean
        default: true
    secrets:
      RELEASE_APP_KEY:
        description: Закрытый ключ приложения, которым бот открывает и сливает PR
        required: true

permissions: {}

jobs:
  capture:
    name: Захват
    permissions:
      contents: read
    # Синтаксис $/ из совета zizmor actionlint не разбирает, поэтому ./
    uses: ./.github/workflows/capture.yml # zizmor: ignore[self-repository]
    with:
      happ_windows: ${{ (inputs.app == 'happ' && inputs.platform == 'windows') && inputs.release || 'none' }}
      happ_android: ${{ (inputs.app == 'happ' && inputs.platform == 'android') && inputs.release || 'none' }}
      incy_android: ${{ (inputs.app == 'incy' && inputs.platform == 'android') && inputs.release || 'none' }}

  update:
    name: Профиль и PR
    needs: capture
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
      pull-requests: write
    outputs:
      pr: ${{ steps.pr.outputs.number }}
      sha: ${{ steps.commit.outputs.sha }}
      branch: ${{ steps.commit.outputs.branch }}
    env:
      APP: ${{ inputs.app }}
      PLATFORM: ${{ inputs.platform }}
      RELEASE: ${{ inputs.release }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Проверка входных данных
        run: |
          [[ "$APP" =~ ^[a-z0-9-]+$ && "$PLATFORM" =~ ^[a-z]+$ && "$RELEASE" =~ ^[0-9A-Za-z._-]+$ ]] || { echo "::error::недопустимые входные данные"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # download-artifact с шаблоном, которому отвечает один артефакт, кладёт файлы прямо в
      # artifacts/ без каталога, а инструмент ищет каталоги capture-…. Поэтому каждый
      # артефакт скачивается в свой каталог по имени.
      - name: Захваты
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          prefix="capture-$APP-$PLATFORM-"
          names=$(gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[] | select(.expired | not) | .name' | grep "^$prefix" || true)
          count=0
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            mkdir -p "artifacts/$name"
            gh run download "$RUN_ID" -R "$REPO" -n "$name" -D "artifacts/$name"
            count=$((count + 1))
          done <<<"$names"
          [ "$count" -gt 0 ] || { echo "::error::нет артефактов захвата $prefix*"; exit 1; }
      # Кэш cargo здесь не нужен: задача публикует код, а сборка инструмента занимает минуты.
      - name: Профиль и образцы по захвату
        run: |
          set -o pipefail
          cargo run --locked --quiet -p raycat-emulation --features tool --bin update-profiles -- \
            "$APP" "$PLATFORM" --release "$RELEASE" --artifacts artifacts --root crates/emulation \
            | tee "$RUNNER_TEMP/report.txt"
      - name: Тесты эмуляции
        run: cargo test --locked --quiet -p raycat-emulation --all-features
      - name: Изменения
        id: changes
        run: |
          if [ -z "$(git status --porcelain -- crates/emulation)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::захват не изменил ни профиль, ни образцы"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --short -- crates/emulation
          fi
      # Ветку, PR и слияние бот делает токеном приложения: в отличие от событий
      # GITHUB_TOKEN, его события запускают обычные проверки PR и CI на main после слияния.
      - id: app
        if: ${{ steps.changes.outputs.changed == 'true' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - name: Коммит и ветка бота
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        id: commit
        if: ${{ steps.changes.outputs.changed == 'true' }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' "crates/emulation/profiles/$APP/$PLATFORM.toml" | head -n 1)
          [[ "$version" =~ ^[0-9A-Za-z._-]+$ ]] || { echo "::error::версия профиля не прочитана"; exit 1; }
          if git diff --quiet -- crates/emulation/profiles; then
            title="test: обновить образцы $APP $PLATFORM $version"
          else
            title="feat: профиль $APP $PLATFORM $version"
          fi
          branch="bot/client-$APP-$PLATFORM-$RELEASE"
          {
            echo "Профиль эмуляции обновлён автоматически по захвату настоящего приложения."
            echo
            echo "- приложение: $APP, платформа: $PLATFORM"
            echo "- релиз: $RELEASE"
            echo "- версия в запросе приложения: $version"
            echo "- прогон: $RUN_URL"
            echo
            echo "Изменения профиля:"
            echo
            echo '```diff'
            git diff -U0 -- crates/emulation/profiles | grep '^[+-][^+-]' || true
            echo '```'
            echo
            echo "Образцы запросов в crates/emulation/captures заменены снятыми в этом прогоне."
          } > "$RUNNER_TEMP/body.md"
          { echo "$title"; echo; cat "$RUNNER_TEMP/body.md"; } > "$RUNNER_TEMP/message.txt"
          git config user.name sleepyhead-dev
          git config user.email 184401951+sleepyhead-dev@users.noreply.github.com
          git switch -c "$branch"
          git add crates/emulation
          git commit -q -F "$RUNNER_TEMP/message.txt"
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push --force origin "$branch"
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "branch=$branch"
            echo "title=$title"
          } >> "$GITHUB_OUTPUT"
      - name: Pull request
        id: pr
        if: ${{ steps.changes.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BRANCH: ${{ steps.commit.outputs.branch }}
          TITLE: ${{ steps.commit.outputs.title }}
        run: |
          number=$(gh pr list -R "$REPO" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" -R "$REPO" --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"
          else
            base=$(gh api "repos/$REPO" --jq .default_branch)
            if ! output=$(gh pr create -R "$REPO" --base "$base" --head "$BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/body.md" --label эмуляция 2>&1); then
              printf '%s\n' "$output"
              {
                echo
                echo "Ветка $BRANCH отправлена, но PR создать не удалось:"
                echo "$output"
                echo
                echo "Если Actions не разрешено создавать PR (Settings, Actions, General, Workflow permissions), откройте PR вручную: https://github.com/$REPO/compare/$base...$BRANCH?expand=1"
              } >> "$RUNNER_TEMP/report.txt"
              exit 1
            fi
            number=$(printf '%s\n' "$output" | tail -n 1)
            number=${number##*/}
          fi
          [[ "$number" =~ ^[0-9]+$ ]] || { echo "::error::номер PR не определён"; exit 1; }
          echo "number=$number" >> "$GITHUB_OUTPUT"
      - name: Устаревшие PR
        if: ${{ steps.changes.outputs.changed == 'true' }}
        run: |
          gh pr list -R "$REPO" --state open --limit 200 --json number,headRefName > "$RUNNER_TEMP/open.json"
          bash .github/bots/superseded.sh "$RELEASE" "bot/client-$APP-$PLATFORM-" < "$RUNNER_TEMP/open.json" > "$RUNNER_TEMP/superseded.txt"
          while IFS=$'\t' read -r old _; do
            gh pr close "$old" -R "$REPO" --delete-branch --comment "Вышла версия $RELEASE, закрываю."
          done < "$RUNNER_TEMP/superseded.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: update-report-${{ inputs.app }}-${{ inputs.platform }}
          path: ${{ runner.temp }}/report.txt
          if-no-files-found: ignore
          retention-days: 14

  verify:
    name: Проверки и слияние
    needs: update
    if: ${{ needs.update.outputs.pr != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      checks: read
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ needs.update.outputs.pr }}
      SHA: ${{ needs.update.outputs.sha }}
      BRANCH: ${{ needs.update.outputs.branch }}
    steps:
      # Ветку, PR и слияние бот делает токеном приложения: в отличие от событий
      # GITHUB_TOKEN, его события запускают обычные проверки PR и CI на main после слияния.
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - name: Ожидание проверок PR
        run: |
          # PR открыт токеном приложения, на нём идут обычные проверки. Бот ждёт
          # обязательные из ruleset — «Заголовок PR» и «Итог» — на своём коммите.
          state() {
            gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" |
              jq -r --arg name "$1" '[.check_runs[] | select(.name == $name)] | sort_by(.started_at) | last | if . == null then "нет" else "\(.status) \(.conclusion)" end'
          }
          for _ in $(seq 1 160); do
            title=$(state "Заголовок PR")
            total=$(state "Итог")
            echo "Заголовок PR: $title; Итог: $total"
            if [[ $title == completed* && $total == completed* ]]; then
              [ "$title" = "completed success" ] && [ "$total" = "completed success" ]
              exit
            fi
            sleep 30
          done
          echo "::error::проверки PR не закончились за 80 минут"
          exit 1
      - name: Слияние
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        if: ${{ inputs.merge }}
        run: |
          title=$(gh pr view "$PR" -R "$REPO" --json title --jq .title)
          body=$(gh pr view "$PR" -R "$REPO" --json body --jq .body)
          gh pr merge "$PR" -R "$REPO" --squash --delete-branch --match-head-commit "$SHA" --subject "$title (#$PR)" --body "$body"
      - name: Слияние отключено
        if: ${{ !inputs.merge }}
        run: echo "::notice::проверки зелёные, слияние отключено входным параметром, PR $PR остаётся открытым"

  close:
    name: Закрытие issue клиента
    needs: verify
    if: ${{ inputs.merge && needs.verify.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      APP: ${{ inputs.app }}
      PLATFORM: ${{ inputs.platform }}
      RELEASE: ${{ inputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Закрытие issue
        run: |
          gh issue list -R "$REPO" --state open --label эмуляция --limit 200 --json number,title > "$RUNNER_TEMP/issues.json"
          bash .github/bots/client-issues.sh "$APP" "$PLATFORM" "$RUNNER_TEMP/issues.json" > "$RUNNER_TEMP/close.txt"
          while read -r number; do
            gh issue close "$number" -R "$REPO" --comment "Профиль обновлён до $RELEASE, закрываю."
          done < "$RUNNER_TEMP/close.txt"

  report:
    name: Отчёт об ошибке
    needs: [capture, update, verify]
    if: ${{ failure() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      APP: ${{ inputs.app }}
      PLATFORM: ${{ inputs.platform }}
      RELEASE: ${{ inputs.release }}
      CAPTURE: ${{ needs.capture.result }}
      UPDATE: ${{ needs.update.result }}
      VERIFY: ${{ needs.verify.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: update-report-${{ inputs.app }}-${{ inputs.platform }}
          path: report
      - name: Issue
        run: |
          title="Не удалось обновить профиль $APP $PLATFORM до $RELEASE"
          {
            echo "Автоматическое обновление профиля не дошло до слияния."
            echo
            echo "- захват: $CAPTURE"
            echo "- профиль и PR: $UPDATE"
            echo "- проверки и слияние: $VERIFY"
            echo "- прогон: $RUN_URL"
            if [ -s report/report.txt ]; then
              echo
              echo "Отчёт инструмента:"
              echo
              echo '````text'
              head -c 50000 report/report.txt
              echo '````'
            fi
          } > body.md
          existing=$(gh issue list -R "$REPO" --state open --label эмуляция --json number,title |
            jq -r --arg title "$title" '[.[] | select(.title == $title)][0].number // empty')
          if [ -n "$existing" ]; then
            last=$(gh issue view "$existing" -R "$REPO" --json comments --jq '.comments | last | .author.login // ""')
            if [ "$last" = github-actions ]; then
              gh issue comment "$existing" -R "$REPO" --edit-last --body-file body.md
            else
              gh issue comment "$existing" -R "$REPO" --body-file body.md
            fi
          else
            gh issue create -R "$REPO" --title "$title" --body-file body.md --label эмуляция --label ci
          fi
