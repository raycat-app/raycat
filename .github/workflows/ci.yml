name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Отладочные сведения до строк кода: тот же вывод паник, но сборка и кэш заметно меньше.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # На main собирается то, что публикует «Выпуск dev» (полный LTO), в остальных запусках
  # профиль ci: те же проверки, но без полного LTO.
  BUILD_PROFILE: ${{ github.ref == 'refs/heads/main' && 'release' || 'ci' }}
  # Кэш пишется только с main: запуски из PR и веток его читают, но не меняют.
  CACHE_SAVE: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
  BINFMT_IMAGE: tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

jobs:
  lint:
    name: Форматирование и линтеры
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ env.CACHE_SAVE }}
          cache-on-failure: true
          add-rust-environment-hash-key: false
      - id: fmt
        run: cargo fmt --all --check
      - name: Патч форматирования
        if: ${{ failure() && steps.fmt.outcome == 'failure' }}
        run: cargo fmt --all && git diff > rustfmt.patch
      - if: ${{ failure() && steps.fmt.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustfmt-patch
          path: rustfmt.patch
          retention-days: 7
      - run: cargo clippy --workspace --all-targets --all-features --locked
      - uses: crate-ci/typos@00f422f3b19c57bc6338715ebfe3316d38768461 # v1.50.3

  lockfile:
    name: Cargo.lock
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Для проверки хватает cargo с образа раннера: rustup не качает тулчейн из rust-toolchain.toml.
      - id: lock
        env:
          RUSTUP_TOOLCHAIN: stable
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Обновлённый Cargo.lock
        if: ${{ failure() && steps.lock.outcome == 'failure' }}
        run: cargo metadata --format-version 1 > /dev/null
      - if: ${{ failure() && steps.lock.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Cargo.lock
          path: Cargo.lock
          retention-days: 7

  # Единственная задача, которая пишет кэш dev: остальные задачи с профилем dev его только читают.
  test:
    name: Тесты
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: dev
          save-if: ${{ env.CACHE_SAVE }}
          cache-on-failure: true
          add-rust-environment-hash-key: false
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace --all-features --locked

  msrv:
    name: Минимальная версия Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Версия из Cargo.toml
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - name: Установка
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: |
          rustup toolchain install "$MSRV" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$MSRV" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ env.CACHE_SAVE }}
          cache-on-failure: true
          add-rust-environment-hash-key: false
      - name: Проверка сборки
        run: cargo check --workspace --all-targets --all-features --locked

  deny:
    name: Лицензии и уязвимости зависимостей
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-deny
      - run: cargo deny --log-level warn --manifest-path ./Cargo.toml --all-features check

  workflows:
    name: Проверка workflow
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      HADOLINT_VERSION: 2.15.1
      HADOLINT_SHA256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # actionlint проверяет run-скрипты через shellcheck, если он есть.
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: shellcheck
      - name: actionlint
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" actionlint
          ./actionlint -color
      - name: shellcheck скриптов выпуска и сборки
        run: shellcheck --severity=warning .github/release/*.sh .github/build/fetch-xray.sh .github/build/smoke-image.sh
      - name: hadolint
        run: |
          curl -fsSLo hadolint "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          echo "${HADOLINT_SHA256}  hadolint" | sha256sum -c -
          chmod +x hadolint
          ./hadolint Dockerfile
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false

  # Сборки по целям разнесены на отдельные задачи: образ, установщик и e2e ждут только свою цель.
  build-x86_64:
    name: Сборка x86_64-unknown-linux-musl
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TARGET: x86_64-unknown-linux-musl
      RAYCAT_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: build-x86_64-${{ env.BUILD_PROFILE }}
          save-if: ${{ env.CACHE_SAVE }}
          cache-on-failure: true
          add-rust-environment-hash-key: false
      - name: Сборка
        run: cargo build --profile "$BUILD_PROFILE" --locked --target "$TARGET"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: raycat-x86_64-unknown-linux-musl
          path: target/x86_64-unknown-linux-musl/${{ env.BUILD_PROFILE }}/raycat
          retention-days: 14
          if-no-files-found: error
      - name: Запуск
        run: |
          bin="target/$TARGET/$BUILD_PROFILE/raycat"
          version_line=$("$bin" --version)
          echo "$version_line"
          [[ "$version_line" == *" (${GITHUB_SHA:0:7})" ]]
          "$bin" --help > /dev/null
          file "$bin"
          ls -l "$bin"

  build-aarch64:
    name: Сборка aarch64-unknown-linux-musl
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TARGET: aarch64-unknown-linux-musl
      RAYCAT_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: build-aarch64-${{ env.BUILD_PROFILE }}
          save-if: ${{ env.CACHE_SAVE }}
          cache-on-failure: true
          add-rust-environment-hash-key: false
      - name: Сборка
        run: cargo build --profile "$BUILD_PROFILE" --locked --target "$TARGET"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: raycat-aarch64-unknown-linux-musl
          path: target/aarch64-unknown-linux-musl/${{ env.BUILD_PROFILE }}/raycat
          retention-days: 14
          if-no-files-found: error
      - name: Запуск
        run: |
          bin="target/$TARGET/$BUILD_PROFILE/raycat"
          version_line=$("$bin" --version)
          echo "$version_line"
          [[ "$version_line" == *" (${GITHUB_SHA:0:7})" ]]
          "$bin" --help > /dev/null
          file "$bin"
          ls -l "$bin"

  build-armv7:
    name: Сборка armv7-unknown-linux-musleabihf
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TARGET: armv7-unknown-linux-musleabihf
      RAYCAT_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: build-armv7-${{ env.BUILD_PROFILE }}
          save-if: ${{ env.CACHE_SAVE }}
          cache-on-failure: true
          add-rust-environment-hash-key: false
      - name: Сборка
        run: cargo build --profile "$BUILD_PROFILE" --locked --target "$TARGET"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: raycat-armv7-unknown-linux-musleabihf
          path: target/armv7-unknown-linux-musleabihf/${{ env.BUILD_PROFILE }}/raycat
          retention-days: 14
          if-no-files-found: error
      # Статический armv7-бинарник запускается напрямую: ядро передаёт его в qemu через binfmt_misc.
      - name: qemu
        run: docker run --privileged --rm "$BINFMT_IMAGE" --install arm
      - name: Запуск
        run: |
          bin="target/$TARGET/$BUILD_PROFILE/raycat"
          version_line=$("$bin" --version)
          echo "$version_line"
          [[ "$version_line" == *" (${GITHUB_SHA:0:7})" ]]
          "$bin" --help > /dev/null
          file "$bin"
          ls -l "$bin"

  # Прогрев кэша профиля ci: PR и ручные запуски с веток собираются этим профилем и читают кэш
  # main, а сборки main идут профилем release и кэш ci не создают.
  warm-ci:
    name: Кэш сборки ${{ matrix.target }}
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            key: x86_64
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            key: aarch64
            runner: ubuntu-24.04-arm
          - target: armv7-unknown-linux-musleabihf
            key: armv7
            runner: ubuntu-24.04
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: build-${{ matrix.key }}-ci
          cache-on-failure: true
          add-rust-environment-hash-key: false
      - name: Сборка зависимостей
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        run: cargo build --profile ci --locked --target "$TARGET"

  test-aarch64:
    name: Тесты на aarch64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: test-aarch64
          save-if: ${{ env.CACHE_SAVE }}
          cache-on-failure: true
          add-rust-environment-hash-key: false
      - run: cargo test --locked --target aarch64-unknown-linux-musl

  test-armv7:
    name: Тесты на armv7 (qemu)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: qemu
        run: docker run --privileged --rm "$BINFMT_IMAGE" --install arm
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: test-armv7
          save-if: ${{ env.CACHE_SAVE }}
          cache-on-failure: true
          add-rust-environment-hash-key: false
      - run: cargo test --locked --target armv7-unknown-linux-musleabihf

  image-amd64:
    name: Образ Docker (amd64)
    needs: build-x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      ARCH: amd64
      XRAY_KEY: x86_64
      XRAY_ARCHIVE: Xray-linux-64.zip
      XRAY_BUILD: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: raycat-x86_64-unknown-linux-musl
          path: dist/amd64
      - name: Сборка образа
        run: |
          bash .github/build/docker-args.sh "$XRAY_KEY" "$XRAY_ARCHIVE" "$XRAY_BUILD" > "$RUNNER_TEMP/docker-args.txt"
          mapfile -t args < "$RUNNER_TEMP/docker-args.txt"
          docker build "${args[@]}" --tag raycat:ci .
      - name: Сохранение образа
        run: docker save raycat:ci | gzip -1 > "$RUNNER_TEMP/image-${ARCH}.tar.gz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-amd64
          path: ${{ runner.temp }}/image-amd64.tar.gz
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - name: Дымовая проверка
        run: bash .github/build/smoke-image.sh

  image-arm64:
    name: Образ Docker (arm64${{ matrix.suffix }})
    needs: build-aarch64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - suffix: ""
            xray_build: release
          - suffix: -noaes
            xray_build: noaes
    env:
      ARCH: arm64${{ matrix.suffix }}
      XRAY_KEY: aarch64
      XRAY_ARCHIVE: Xray-linux-arm64-v8a.zip
      XRAY_BUILD: ${{ matrix.xray_build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: raycat-aarch64-unknown-linux-musl
          path: dist/arm64
      # Сборка xray из исходников (noaes) идёт через buildx с кэшем слоёв в GitHub Actions:
      # пока versions.toml и Dockerfile те же, Go-стадия берётся из кэша.
      - name: Buildx
        if: ${{ matrix.xray_build == 'noaes' }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Доступ buildx к кэшу Actions
        if: ${{ matrix.xray_build == 'noaes' }}
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - name: Сборка образа
        env:
          CACHE_SCOPE: ${{ matrix.xray_build == 'noaes' && 'noaes-arm64' || '' }}
        run: |
          bash .github/build/docker-args.sh "$XRAY_KEY" "$XRAY_ARCHIVE" "$XRAY_BUILD" > "$RUNNER_TEMP/docker-args.txt"
          mapfile -t args < "$RUNNER_TEMP/docker-args.txt"
          cache=()
          if [ -n "$CACHE_SCOPE" ]; then
            cache+=(--cache-from "type=gha,scope=$CACHE_SCOPE")
            if [ "$CACHE_SAVE" = true ]; then
              cache+=(--cache-to "type=gha,mode=max,scope=$CACHE_SCOPE")
            fi
          fi
          docker buildx build --load "${cache[@]}" "${args[@]}" --tag raycat:ci .
      - name: Сохранение образа
        run: docker save raycat:ci | gzip -1 > "$RUNNER_TEMP/image-${ARCH}.tar.gz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-arm64${{ matrix.suffix }}
          path: ${{ runner.temp }}/image-arm64${{ matrix.suffix }}.tar.gz
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - name: Дымовая проверка
        run: bash .github/build/smoke-image.sh

  xray-noaes-armv7:
    name: xray для процессоров без AES (armv7)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - name: Сборка
        run: |
          bash .github/build/docker-args.sh armv7 Xray-linux-arm32-v7a.zip noaes > "$RUNNER_TEMP/docker-args.txt"
          mapfile -t args < "$RUNNER_TEMP/docker-args.txt"
          cache=(--cache-from "type=gha,scope=noaes-armv7")
          if [ "$CACHE_SAVE" = true ]; then
            cache+=(--cache-to "type=gha,mode=max,scope=noaes-armv7")
          fi
          docker buildx build --platform linux/arm/v7 "${cache[@]}" "${args[@]}" --target xray-noaes --output type=local,dest=out .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xray-noaes-armv7
          path: out/out/xray
          retention-days: 7
          if-no-files-found: error
      - name: qemu
        run: docker run --privileged --rm "$BINFMT_IMAGE" --install arm
      - name: Проверка
        run: |
          bin=out/out/xray
          file "$bin"
          ls -l "$bin"
          file "$bin" | grep -q 'ELF 32-bit.*ARM, EABI5'
          version_output=$("$bin" version)
          echo "$version_output"
          go_version=$(sed -n 's/^go_version = "\(.*\)"/\1/p' versions.toml)
          grep -qF "(go${go_version} " <<<"$version_output"
          for config in crates/xray/tests/golden/*.json; do
            echo "::group::${config}"
            "$bin" run -test -c "$config"
            echo "::endgroup::"
          done

  xray-config:
    name: Проверка конфигов xray
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Скачивание xray
        run: bash .github/build/fetch-xray.sh
      - name: xray run -test
        run: |
          for config in crates/xray/tests/golden/*.json; do
            echo "::group::${config}"
            ./xray run -test -c "$config"
            echo "::endgroup::"
          done

  xray-api:
    name: API xray
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: dev
          save-if: false
          add-rust-environment-hash-key: false
      - name: Скачивание xray
        run: bash .github/build/fetch-xray.sh
      - name: Тесты клиента с настоящим xray
        env:
          XRAY_BIN: ./xray
        run: cargo test -p raycat-xray-api --locked

  e2e-proxy:
    name: "e2e: прокси"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: dev
          save-if: false
          add-rust-environment-hash-key: false
      - name: Сборка
        run: cargo build --locked
      - name: Скачивание xray
        run: bash .github/build/fetch-xray.sh
      - name: Стенд
        run: bash .github/e2e/proxy.sh

  nftables:
    name: Правила nftables
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: dev
          save-if: false
          add-rust-environment-hash-key: false
      - name: Сборка и nftables
        run: |
          { sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends nftables; } > /dev/null &
          apt=$!
          cargo build --locked -p raycat-netfilter --example ctl
          wait "$apt"
      - name: Стенд
        run: bash .github/e2e/netfilter.sh

  e2e-gateway:
    name: "e2e: шлюз"
    needs: image-amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-amd64
          path: ${{ runner.temp }}/image
      # Образ python для служебных контейнеров стенда качается параллельно с загрузкой образа raycat.
      - name: Загрузка образов
        env:
          IMAGE_DIR: ${{ runner.temp }}/image
        run: |
          docker pull --quiet python:3.13-alpine > /dev/null &
          gunzip -c "$IMAGE_DIR/image-amd64.tar.gz" | docker load
          wait
      - name: Стенд
        run: bash .github/e2e/gateway.sh

  installer-lint:
    name: "Установщик: shellcheck"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: shellcheck
      - name: shellcheck
        run: |
          shellcheck --shell=sh deploy/install.sh .github/e2e/installer/container.sh
          shellcheck --shell=bash .github/e2e/installer/release.sh .github/e2e/installer/systemd.sh
      - name: Разбор dash и bash
        run: |
          dash -n deploy/install.sh
          dash -n .github/e2e/installer/container.sh
          bash -n .github/e2e/installer/release.sh
          bash -n .github/e2e/installer/systemd.sh

  installer:
    name: "Установщик: ${{ matrix.image }}"
    needs: build-x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12-slim", "alpine:3.24"]
    env:
      IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: raycat-x86_64-unknown-linux-musl
          path: dist
      - name: Скачивание xray
        run: bash .github/build/fetch-xray.sh
      - name: Ресурсы выпуска
        run: |
          chmod +x dist/raycat
          bash .github/e2e/installer/release.sh "$RUNNER_TEMP/release" 0.9.0 dist/raycat ./xray
          bash .github/e2e/installer/release.sh "$RUNNER_TEMP/release2" 0.9.1 dist/raycat ./xray pad
      - name: Стенд
        run: |
          docker run --rm \
            -v "$PWD/.github/e2e/installer:/e2e:ro" \
            -v "$PWD/deploy:/repo/deploy:ro" \
            -v "$RUNNER_TEMP/release:/release:ro" \
            -v "$RUNNER_TEMP/release2:/release2:ro" \
            "$IMAGE" sh /e2e/container.sh

  installer-systemd:
    name: "Установщик: systemd"
    needs: build-x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: raycat-x86_64-unknown-linux-musl
          path: dist
      - name: Скачивание xray
        run: bash .github/build/fetch-xray.sh
      - name: nftables
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends nftables
      - name: Ресурсы выпуска
        run: |
          chmod +x dist/raycat
          bash .github/e2e/installer/release.sh "$RUNNER_TEMP/release" 0.9.0 dist/raycat ./xray
          bash .github/e2e/installer/release.sh "$RUNNER_TEMP/release2" 0.9.1 dist/raycat ./xray pad
      - name: Стенд
        run: bash .github/e2e/installer/systemd.sh "$RUNNER_TEMP/release" "$RUNNER_TEMP/release2"

  e2e-lan:
    name: "e2e: шлюз для локальной сети"
    needs: image-amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-amd64
          path: ${{ runner.temp }}/image
      # Образ python для служебных контейнеров стенда качается параллельно с загрузкой образа raycat.
      - name: Загрузка образов
        env:
          IMAGE_DIR: ${{ runner.temp }}/image
        run: |
          docker pull --quiet python:3.13-alpine > /dev/null &
          gunzip -c "$IMAGE_DIR/image-amd64.tar.gz" | docker load
          wait
      - name: Стенд
        run: bash .github/e2e/lan.sh

  release-scripts:
    name: Скрипты выпуска
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash .github/release/test.sh

  result:
    name: Итог
    if: ${{ always() }}
    needs:
      - lint
      - lockfile
      - test
      - msrv
      - deny
      - workflows
      - build-x86_64
      - build-aarch64
      - build-armv7
      - test-aarch64
      - test-armv7
      - image-amd64
      - image-arm64
      - xray-noaes-armv7
      - xray-config
      - xray-api
      - e2e-proxy
      - nftables
      - e2e-gateway
      - e2e-lan
      - installer-lint
      - installer
      - installer-systemd
      - release-scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Все проверки пройдены
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: test "$FAILED" = false

  # Публикует dev-выпуск тех же артефактов, что прошли этот запуск. С веток (ручной запуск CI)
  # идёт сухой прогон без публикации.
  release:
    name: Выпуск dev
    needs: result
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-dev.yml # zizmor: ignore[self-repository] actionlint не знает синтаксиса $/
    with:
      dry_run: ${{ github.event_name != 'push' }}
