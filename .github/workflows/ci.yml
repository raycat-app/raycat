name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Отладочные сведения до строк кода: тот же вывод паник, но сборка и кэш заметно меньше.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # На main собирается то, что публикует «Выпуск dev» (полный LTO), в остальных запусках
  # профиль ci: те же проверки, но без полного LTO.
  BUILD_PROFILE: ${{ github.ref == 'refs/heads/main' && 'release' || 'ci' }}
  # Кэш пишется только с main: запуски из PR и веток его читают, но не меняют.
  CACHE_SAVE: ${{ github.ref == 'refs/heads/main' }}
  BINFMT_IMAGE: tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

jobs:
  # Меняются ли файлы, от которых зависит программа. Правка только README, других .md и
  # картинок в .github/assets не трогает сборку: тяжёлые проверки (сборки, тесты, e2e)
  # пропускаются, «Итог» засчитывает пропуск, dev-выпуск не выходит. Ручной запуск и
  # неизвестная база сравнения считаются изменением кода.
  changes:
    name: Изменения
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: bash .github/build/changes.sh "$EVENT" "$BASE" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  lint:
    name: Форматирование и линтеры
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ env.CACHE_SAVE }}
          cache-on-failure: true
          add-rust-environment-hash-key: false
      - id: fmt
        run: cargo fmt --all --check
      - name: Патч форматирования
        if: ${{ failure() && steps.fmt.outcome == 'failure' }}
        run: cargo fmt --all && git diff > rustfmt.patch
      - if: ${{ failure() && steps.fmt.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rustfmt-patch
          path: rustfmt.patch
          retention-days: 7
      - run: cargo clippy --workspace --all-targets --all-features --locked
      - uses: crate-ci/typos@4c8b7f51ca60df14e3c5ca82770dfbbe6c3dae85 # v1.52.0
        with:
          config: .github/typos.toml

  # Быстрые проверки без сборки в одном задании: у бесплатного тарифа 20 заданий
  # одновременно, а каждое отдельное задание тратит 10–20 с на запуск. Шаги идут все, даже
  # если упал предыдущий: в итоге видны все проблемы сразу.
  scripts:
    name: Скрипты и конфиги
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: shellcheck
      # Для проверки хватает cargo с образа раннера: rustup не качает тулчейн из rust-toolchain.toml.
      - id: lock
        name: Cargo.lock
        env:
          RUSTUP_TOOLCHAIN: stable
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Обновлённый Cargo.lock
        if: ${{ !cancelled() && steps.lock.outcome == 'failure' }}
        env:
          RUSTUP_TOOLCHAIN: stable
        run: cargo metadata --format-version 1 > /dev/null
      - if: ${{ !cancelled() && steps.lock.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Cargo.lock
          path: Cargo.lock
          retention-days: 7
      - name: "Установщик: shellcheck"
        if: ${{ !cancelled() }}
        run: |
          shellcheck --shell=sh deploy/install.sh .github/e2e/installer/container.sh
          shellcheck --shell=bash .github/e2e/installer/release.sh .github/e2e/installer/systemd.sh
      - name: "Установщик: разбор dash и bash"
        if: ${{ !cancelled() }}
        run: |
          dash -n deploy/install.sh
          dash -n .github/e2e/installer/container.sh
          bash -n .github/e2e/installer/release.sh
          bash -n .github/e2e/installer/systemd.sh
      - name: Скрипты выпуска
        if: ${{ !cancelled() }}
        run: bash .github/release/test.sh
      - name: Скрипты обновления xray
        if: ${{ !cancelled() }}
        run: bash .github/xray/test.sh
      - name: Скрипты зависимостей
        if: ${{ !cancelled() }}
        run: bash .github/deps/test.sh
      - name: Скрипты ботов
        if: ${{ !cancelled() }}
        run: bash .github/bots/test.sh
      # Архив xray по версии из versions.toml: не качать его с GitHub в каждом задании.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !cancelled() }}
        with:
          path: ~/.cache/raycat-xray
          key: xray-${{ hashFiles('.github/versions.toml') }}
      - id: xray
        name: Скачивание xray
        if: ${{ !cancelled() }}
        run: XRAY_CACHE="$HOME/.cache/raycat-xray" bash .github/build/fetch-xray.sh
      - name: Конфиги xray (xray run -test)
        if: ${{ !cancelled() && steps.xray.outcome == 'success' }}
        run: |
          for config in crates/xray/tests/golden/*.json; do
            echo "::group::${config}"
            ./xray run -test -c "$config"
            echo "::endgroup::"
          done

  schema:
    name: Схема настроек
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: dev
          save-if: false
          add-rust-environment-hash-key: false
      - id: check
        run: |
          cargo run --locked -p raycat-config --features schema --bin config-schema > "$RUNNER_TEMP/config.schema.json"
          diff -u deploy/config.schema.json "$RUNNER_TEMP/config.schema.json"
      - name: В релизный бинарник schemars не входит
        run: |
          cargo tree --locked -p raycat --edges normal > "$RUNNER_TEMP/tree.txt"
          if grep -q schemars "$RUNNER_TEMP/tree.txt"; then
            echo "::error::schemars попал в граф зависимостей крейта raycat"
            exit 1
          fi
      - if: ${{ failure() && steps.check.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: config.schema.json
          path: ${{ runner.temp }}/config.schema.json
          retention-days: 7

  # Единственная задача, которая пишет кэш dev: остальные задачи с профилем dev его только читают.
  test:
    name: Тесты
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: dev
          save-if: ${{ env.CACHE_SAVE }}
          cache-on-failure: true
          add-rust-environment-hash-key: false
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace --all-features --locked

  msrv:
    name: Минимальная версия Rust
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Версия из Cargo.toml
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - name: Установка
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: |
          rustup toolchain install "$MSRV" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$MSRV" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ env.CACHE_SAVE }}
          cache-on-failure: true
          add-rust-environment-hash-key: false
      - name: Проверка сборки
        run: cargo check --workspace --all-targets --all-features --locked

  deny:
    name: Лицензии и уязвимости зависимостей
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-deny
      - run: cargo deny --config .cargo/deny.toml --log-level warn --manifest-path ./Cargo.toml --all-features check

  workflows:
    name: Проверка workflow
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      HADOLINT_VERSION: 2.15.1
      HADOLINT_SHA256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # actionlint проверяет run-скрипты через shellcheck, если он есть.
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: shellcheck
      - name: actionlint
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO --retry 5 --retry-all-errors "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" actionlint
          ./actionlint -color
      - name: shellcheck скриптов выпуска и сборки
        run: shellcheck --severity=warning .github/release/*.sh .github/xray/*.sh .github/deps/*.sh .github/bots/*.sh .github/build/fetch-xray.sh .github/build/smoke-image.sh .github/build/changes.sh
      - name: hadolint
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o hadolint "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          echo "${HADOLINT_SHA256}  hadolint" | sha256sum -c -
          chmod +x hadolint
          ./hadolint deploy/Dockerfile
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false

  # Сборки по целям разнесены на отдельные задачи: образ, установщик и e2e ждут только свою цель.
  build-x86_64:
    name: Сборка x86_64-unknown-linux-musl
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TARGET: x86_64-unknown-linux-musl
      RAYCAT_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # История с тегами: по ней считается номер выпуска.
          fetch-depth: 0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: build-x86_64-${{ env.BUILD_PROFILE }}
          save-if: ${{ env.CACHE_SAVE }}
          cache-on-failure: true
          add-rust-environment-hash-key: false
      # Номер, под которым выйдет эта сборка: он же попадёт в `raycat --version`.
      - name: Номер выпуска
        run: |
          version=$(bash .github/release/next-version.sh)
          echo "Номер выпуска: $version"
          echo "RAYCAT_RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Сборка
        run: cargo build --profile "$BUILD_PROFILE" --locked --target "$TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: raycat-x86_64-unknown-linux-musl
          path: target/x86_64-unknown-linux-musl/${{ env.BUILD_PROFILE }}/raycat
          retention-days: 14
          if-no-files-found: error
      - name: Запуск
        run: |
          bin="target/$TARGET/$BUILD_PROFILE/raycat"
          version_line=$("$bin" --version)
          echo "$version_line"
          [[ "$version_line" == "raycat ${RAYCAT_RELEASE_VERSION} (${GITHUB_SHA:0:7})" ]]
          "$bin" --help > /dev/null
          file "$bin"
          ls -l "$bin"

  build-aarch64:
    name: Сборка aarch64-unknown-linux-musl
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TARGET: aarch64-unknown-linux-musl
      RAYCAT_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # История с тегами: по ней считается номер выпуска.
          fetch-depth: 0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: build-aarch64-${{ env.BUILD_PROFILE }}
          save-if: ${{ env.CACHE_SAVE }}
          cache-on-failure: true
          add-rust-environment-hash-key: false
      # Номер, под которым выйдет эта сборка: он же попадёт в `raycat --version`.
      - name: Номер выпуска
        run: |
          version=$(bash .github/release/next-version.sh)
          echo "Номер выпуска: $version"
          echo "RAYCAT_RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Сборка
        run: cargo build --profile "$BUILD_PROFILE" --locked --target "$TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: raycat-aarch64-unknown-linux-musl
          path: target/aarch64-unknown-linux-musl/${{ env.BUILD_PROFILE }}/raycat
          retention-days: 14
          if-no-files-found: error
      - name: Запуск
        run: |
          bin="target/$TARGET/$BUILD_PROFILE/raycat"
          version_line=$("$bin" --version)
          echo "$version_line"
          [[ "$version_line" == "raycat ${RAYCAT_RELEASE_VERSION} (${GITHUB_SHA:0:7})" ]]
          "$bin" --help > /dev/null
          file "$bin"
          ls -l "$bin"

  build-armv7:
    name: Сборка armv7-unknown-linux-musleabihf
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TARGET: armv7-unknown-linux-musleabihf
      RAYCAT_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # История с тегами: по ней считается номер выпуска.
          fetch-depth: 0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: build-armv7-${{ env.BUILD_PROFILE }}
          save-if: ${{ env.CACHE_SAVE }}
          cache-on-failure: true
          add-rust-environment-hash-key: false
      # Номер, под которым выйдет эта сборка: он же попадёт в `raycat --version`.
      - name: Номер выпуска
        run: |
          version=$(bash .github/release/next-version.sh)
          echo "Номер выпуска: $version"
          echo "RAYCAT_RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Сборка
        run: cargo build --profile "$BUILD_PROFILE" --locked --target "$TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: raycat-armv7-unknown-linux-musleabihf
          path: target/armv7-unknown-linux-musleabihf/${{ env.BUILD_PROFILE }}/raycat
          retention-days: 14
          if-no-files-found: error
      # Статический armv7-бинарник запускается напрямую: ядро передаёт его в qemu через binfmt_misc.
      - name: qemu
        run: docker run --privileged --rm "$BINFMT_IMAGE" --install arm
      - name: Запуск
        run: |
          bin="target/$TARGET/$BUILD_PROFILE/raycat"
          version_line=$("$bin" --version)
          echo "$version_line"
          [[ "$version_line" == "raycat ${RAYCAT_RELEASE_VERSION} (${GITHUB_SHA:0:7})" ]]
          "$bin" --help > /dev/null
          file "$bin"
          ls -l "$bin"

  # Прогрев кэша профиля ci: PR и ручные запуски с веток собираются этим профилем и читают кэш
  # main, а сборки main идут профилем release и кэш ci не создают.
  warm-ci:
    name: Кэш сборки ${{ matrix.target }}
    needs: changes
    if: ${{ github.ref == 'refs/heads/main' && needs.changes.outputs.code == 'true' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            key: x86_64
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            key: aarch64
            runner: ubuntu-24.04-arm
          - target: armv7-unknown-linux-musleabihf
            key: armv7
            runner: ubuntu-24.04
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: build-${{ matrix.key }}-ci
          cache-on-failure: true
          add-rust-environment-hash-key: false
      - name: Сборка зависимостей
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        run: cargo build --profile ci --locked --target "$TARGET"

  test-aarch64:
    name: Тесты на aarch64
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test-aarch64
          save-if: ${{ env.CACHE_SAVE }}
          cache-on-failure: true
          add-rust-environment-hash-key: false
      - run: cargo test --locked --target aarch64-unknown-linux-musl

  test-armv7:
    name: Тесты на armv7 (qemu)
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: qemu
        run: docker run --privileged --rm "$BINFMT_IMAGE" --install arm
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test-armv7
          save-if: ${{ env.CACHE_SAVE }}
          cache-on-failure: true
          add-rust-environment-hash-key: false
      - run: cargo test --locked --target armv7-unknown-linux-musleabihf

  image-amd64:
    name: Образ Docker (amd64)
    needs: build-x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      ARCH: amd64
      XRAY_KEY: x86_64
      XRAY_ARCHIVE: Xray-linux-64.zip
      XRAY_BUILD: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: raycat-x86_64-unknown-linux-musl
          path: dist/amd64
      - name: Сборка образа
        run: |
          bash .github/build/docker-args.sh "$XRAY_KEY" "$XRAY_ARCHIVE" "$XRAY_BUILD" > "$RUNNER_TEMP/docker-args.txt"
          mapfile -t args < "$RUNNER_TEMP/docker-args.txt"
          docker build "${args[@]}" --tag raycat:ci .
      - name: Сохранение образа
        run: docker save raycat:ci | gzip -1 > "$RUNNER_TEMP/image-${ARCH}.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-amd64
          path: ${{ runner.temp }}/image-amd64.tar.gz
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - name: Дымовая проверка
        run: bash .github/build/smoke-image.sh

  image-arm64:
    name: Образ Docker (arm64${{ matrix.suffix }})
    needs: build-aarch64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - suffix: ""
            xray_build: release
          - suffix: -noaes
            xray_build: noaes
    env:
      ARCH: arm64${{ matrix.suffix }}
      XRAY_KEY: aarch64
      XRAY_ARCHIVE: Xray-linux-arm64-v8a.zip
      XRAY_BUILD: ${{ matrix.xray_build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: raycat-aarch64-unknown-linux-musl
          path: dist/arm64
      # Сборка xray из исходников (noaes) идёт через buildx с кэшем слоёв в GitHub Actions:
      # пока .github/versions.toml и deploy/Dockerfile те же, Go-стадия берётся из кэша.
      - name: Buildx
        if: ${{ matrix.xray_build == 'noaes' }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Доступ buildx к кэшу Actions
        if: ${{ matrix.xray_build == 'noaes' }}
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - name: Сборка образа
        env:
          CACHE_SCOPE: ${{ matrix.xray_build == 'noaes' && 'noaes-arm64' || '' }}
        run: |
          bash .github/build/docker-args.sh "$XRAY_KEY" "$XRAY_ARCHIVE" "$XRAY_BUILD" > "$RUNNER_TEMP/docker-args.txt"
          mapfile -t args < "$RUNNER_TEMP/docker-args.txt"
          cache=()
          if [ -n "$CACHE_SCOPE" ]; then
            cache+=(--cache-from "type=gha,scope=$CACHE_SCOPE")
            if [ "$CACHE_SAVE" = true ]; then
              cache+=(--cache-to "type=gha,mode=max,scope=$CACHE_SCOPE")
            fi
          fi
          docker buildx build --load "${cache[@]}" "${args[@]}" --tag raycat:ci .
      - name: Сохранение образа
        run: docker save raycat:ci | gzip -1 > "$RUNNER_TEMP/image-${ARCH}.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-arm64${{ matrix.suffix }}
          path: ${{ runner.temp }}/image-arm64${{ matrix.suffix }}.tar.gz
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - name: Дымовая проверка
        run: bash .github/build/smoke-image.sh

  xray-noaes-armv7:
    name: xray для процессоров без AES (armv7)
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - name: Сборка
        run: |
          bash .github/build/docker-args.sh armv7 Xray-linux-arm32-v7a.zip noaes > "$RUNNER_TEMP/docker-args.txt"
          mapfile -t args < "$RUNNER_TEMP/docker-args.txt"
          cache=(--cache-from "type=gha,scope=noaes-armv7")
          if [ "$CACHE_SAVE" = true ]; then
            cache+=(--cache-to "type=gha,mode=max,scope=noaes-armv7")
          fi
          docker buildx build --platform linux/arm/v7 "${cache[@]}" "${args[@]}" --target xray-noaes --output type=local,dest=out .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xray-noaes-armv7
          path: out/out/xray
          retention-days: 7
          if-no-files-found: error
      - name: qemu
        run: docker run --privileged --rm "$BINFMT_IMAGE" --install arm
      - name: Проверка
        run: |
          bin=out/out/xray
          file "$bin"
          ls -l "$bin"
          file "$bin" | grep -q 'ELF 32-bit.*ARM, EABI5'
          version_output=$("$bin" version)
          echo "$version_output"
          go_version=$(sed -n 's/^go_version = "\(.*\)"/\1/p' .github/versions.toml)
          grep -qF "(go${go_version}-noaes " <<<"$version_output"
          noaes_version=$(sed -n '/^\[xray\.noaes\]$/,/^\[/ s/^version = "\(.*\)"/\1/p' .github/versions.toml)
          grep -qF "Xray ${noaes_version} " <<<"$version_output"
          for config in crates/xray/tests/golden/*.json; do
            echo "::group::${config}"
            "$bin" run -test -c "$config"
            echo "::endgroup::"
          done

  xray-api:
    name: API xray
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: dev
          save-if: false
          add-rust-environment-hash-key: false
      # Архив xray по версии из versions.toml: не качать его с GitHub в каждом задании.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/raycat-xray
          key: xray-${{ hashFiles('.github/versions.toml') }}
      - name: Скачивание xray
        run: XRAY_CACHE="$HOME/.cache/raycat-xray" bash .github/build/fetch-xray.sh
      - name: Тесты клиента с настоящим xray
        env:
          XRAY_BIN: ./xray
        run: cargo test -p raycat-xray-api --locked

  e2e-proxy:
    name: "e2e: прокси"
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: dev
          save-if: false
          add-rust-environment-hash-key: false
      - name: Сборка
        run: cargo build --locked
      # Архив xray по версии из versions.toml: не качать его с GitHub в каждом задании.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/raycat-xray
          key: xray-${{ hashFiles('.github/versions.toml') }}
      - name: Скачивание xray
        run: XRAY_CACHE="$HOME/.cache/raycat-xray" bash .github/build/fetch-xray.sh
      - name: Стенд
        run: bash .github/e2e/proxy.sh

  nftables:
    name: Правила nftables
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: dev
          save-if: false
          add-rust-environment-hash-key: false
      - name: Сборка и nftables
        run: |
          { sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends nftables; } > /dev/null &
          apt=$!
          cargo build --locked -p raycat-netfilter --example ctl
          wait "$apt"
      - name: Стенд
        run: bash .github/e2e/netfilter.sh

  e2e-gateway:
    name: "e2e: шлюз${{ matrix.mode == 'guard' && ' (возврат правил)' || matrix.mode == 'hung' && ' (зависший xray)' || '' }}"
    needs: image-amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        mode: [main, guard, hung]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-amd64
          path: ${{ runner.temp }}/image
      # Образ python для служебных контейнеров стенда качается параллельно с загрузкой образа raycat.
      - name: Загрузка образов
        env:
          IMAGE_DIR: ${{ runner.temp }}/image
        run: |
          docker pull --quiet python:3.13-alpine > /dev/null &
          gunzip -c "$IMAGE_DIR/image-amd64.tar.gz" | docker load
          wait
      - name: Стенд
        env:
          MODE: ${{ matrix.mode }}
        run: bash .github/e2e/gateway.sh "$MODE"

  installer:
    name: "Установщик: ${{ matrix.image }}"
    needs: build-x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12-slim", "alpine:3.24"]
    env:
      IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: raycat-x86_64-unknown-linux-musl
          path: dist
      # Архив xray по версии из versions.toml: не качать его с GitHub в каждом задании.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/raycat-xray
          key: xray-${{ hashFiles('.github/versions.toml') }}
      - name: Скачивание xray
        run: XRAY_CACHE="$HOME/.cache/raycat-xray" bash .github/build/fetch-xray.sh
      - name: Ресурсы выпуска
        run: |
          chmod +x dist/raycat
          bash .github/e2e/installer/release.sh "$RUNNER_TEMP/release" 0.9.0 dist/raycat ./xray
          bash .github/e2e/installer/release.sh "$RUNNER_TEMP/release2" 0.9.1 dist/raycat ./xray pad
      - name: Стенд
        run: |
          docker run --rm \
            -v "$PWD/.github/e2e/installer:/e2e:ro" \
            -v "$PWD/deploy:/repo/deploy:ro" \
            -v "$RUNNER_TEMP/release:/release:ro" \
            -v "$RUNNER_TEMP/release2:/release2:ro" \
            "$IMAGE" sh /e2e/container.sh

  installer-systemd:
    name: "Установщик: systemd"
    needs: build-x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: raycat-x86_64-unknown-linux-musl
          path: dist
      # Архив xray по версии из versions.toml: не качать его с GitHub в каждом задании.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/raycat-xray
          key: xray-${{ hashFiles('.github/versions.toml') }}
      - name: Скачивание xray
        run: XRAY_CACHE="$HOME/.cache/raycat-xray" bash .github/build/fetch-xray.sh
      - name: nftables
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends nftables
      - name: Ресурсы выпуска
        run: |
          chmod +x dist/raycat
          bash .github/e2e/installer/release.sh "$RUNNER_TEMP/release" 0.9.0 dist/raycat ./xray
          bash .github/e2e/installer/release.sh "$RUNNER_TEMP/release2" 0.9.1 dist/raycat ./xray pad
      - name: Стенд
        run: bash .github/e2e/installer/systemd.sh "$RUNNER_TEMP/release" "$RUNNER_TEMP/release2"

  e2e-lan:
    name: "e2e: шлюз для локальной сети"
    needs: image-amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-amd64
          path: ${{ runner.temp }}/image
      # Образ python для служебных контейнеров стенда качается параллельно с загрузкой образа raycat.
      - name: Загрузка образов
        env:
          IMAGE_DIR: ${{ runner.temp }}/image
        run: |
          docker pull --quiet python:3.13-alpine > /dev/null &
          gunzip -c "$IMAGE_DIR/image-amd64.tar.gz" | docker load
          wait
      - name: Стенд
        run: bash .github/e2e/lan.sh

  result:
    name: Итог
    if: ${{ always() }}
    needs:
      - changes
      - lint
      - scripts
      - schema
      - test
      - msrv
      - deny
      - workflows
      - build-x86_64
      - build-aarch64
      - build-armv7
      - test-aarch64
      - test-armv7
      - image-amd64
      - image-arm64
      - xray-noaes-armv7
      - xray-api
      - e2e-proxy
      - nftables
      - e2e-gateway
      - e2e-lan
      - installer
      - installer-systemd
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Все проверки пройдены
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: test "$FAILED" = false

  # Публикует dev-выпуск тех же артефактов, что прошли этот запуск. С веток (ручной запуск CI)
  # идёт сухой прогон без публикации. Ручной запуск на main публикует по-настоящему: так боты
  # выпускают свои слияния, а push от GITHUB_TOKEN CI не запускает.
  release:
    name: Выпуск dev
    needs: [changes, result]
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.code == 'true' }}
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-dev.yml # zizmor: ignore[self-repository] actionlint не знает синтаксиса $/
    with:
      dry_run: ${{ github.ref != 'refs/heads/main' }}
    secrets:
      RELEASE_APP_KEY: ${{ secrets.RELEASE_APP_KEY }}
