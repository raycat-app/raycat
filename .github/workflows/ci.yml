name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: Форматирование и линтеры
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - id: fmt
        run: cargo fmt --all --check
      - name: Патч форматирования
        if: ${{ failure() && steps.fmt.outcome == 'failure' }}
        run: cargo fmt --all && git diff > rustfmt.patch
      - if: ${{ failure() && steps.fmt.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustfmt-patch
          path: rustfmt.patch
          retention-days: 7
      - run: cargo clippy --workspace --all-targets --all-features --locked
      - uses: crate-ci/typos@00f422f3b19c57bc6338715ebfe3316d38768461 # v1.50.3

  lockfile:
    name: Cargo.lock
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: lock
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Обновлённый Cargo.lock
        if: ${{ failure() && steps.lock.outcome == 'failure' }}
        run: cargo metadata --format-version 1 > /dev/null
      - if: ${{ failure() && steps.lock.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Cargo.lock
          path: Cargo.lock
          retention-days: 7

  test:
    name: Тесты
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace --all-features --locked

  msrv:
    name: Минимальная версия Rust
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Версия из Cargo.toml
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - name: Установка
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: rustup toolchain install "$MSRV" --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Проверка сборки
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: cargo "+$MSRV" check --workspace --all-targets --all-features --locked

  deny:
    name: Лицензии и уязвимости зависимостей
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  workflows:
    name: Проверка workflow
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # actionlint проверяет run-скрипты через shellcheck, если он есть.
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: shellcheck
      - name: actionlint
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" actionlint
          ./actionlint -color
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false

  build:
    name: Сборка ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: armv7-unknown-linux-musleabihf
            runner: ubuntu-24.04
    env:
      TARGET: ${{ matrix.target }}
      CARGO_TARGET_ARMV7_UNKNOWN_LINUX_MUSLEABIHF_RUNNER: qemu-arm-static
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: clang и qemu
        run: sudo apt-get update -q && sudo apt-get install -y -q clang qemu-user-static
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - name: Сборка
        run: cargo build --release --locked --target "$TARGET"
      - name: Запуск
        run: |
          bin="target/$TARGET/release/raycat"
          case "$TARGET" in
            armv7-*) run() { qemu-arm-static "$@"; } ;;
            *) run() { "$@"; } ;;
          esac
          run "$bin" --version
          run "$bin" --help > /dev/null
          file "$bin"
          ls -l "$bin"
      - name: Тесты на целевой архитектуре
        if: ${{ !startsWith(matrix.target, 'x86_64') }}
        run: cargo test --locked --target "$TARGET"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: raycat-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/raycat
          retention-days: 14
          if-no-files-found: error

  xray-config:
    name: Проверка конфигов xray
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Скачивание xray
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' versions.toml)
          sha256=$(sed -n 's/^x86_64 = "\(.*\)"/\1/p' versions.toml)
          test -n "$version" && test -n "$sha256"
          archive="Xray-linux-64.zip"
          curl -fsSLO "https://github.com/XTLS/Xray-core/releases/download/v${version}/${archive}"
          echo "${sha256}  ${archive}" | sha256sum -c -
          unzip -q "$archive" xray
          ./xray version
      - name: xray run -test
        run: |
          for config in crates/xray/tests/golden/*.json; do
            echo "::group::${config}"
            ./xray run -test -c "$config"
            echo "::endgroup::"
          done

  e2e-proxy:
    name: "e2e: прокси"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Сборка
        run: cargo build --locked
      - name: Скачивание xray
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' versions.toml)
          sha256=$(sed -n 's/^x86_64 = "\(.*\)"/\1/p' versions.toml)
          test -n "$version" && test -n "$sha256"
          archive="Xray-linux-64.zip"
          curl -fsSLO "https://github.com/XTLS/Xray-core/releases/download/v${version}/${archive}"
          echo "${sha256}  ${archive}" | sha256sum -c -
          unzip -q "$archive" xray
          ./xray version
      - name: Стенд
        run: bash .github/e2e/proxy.sh

  result:
    name: Итог
    if: ${{ always() }}
    needs: [lint, lockfile, test, msrv, deny, workflows, build, xray-config, e2e-proxy]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Все проверки пройдены
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: test "$FAILED" = false
