name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: Форматирование и линтеры
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - id: fmt
        run: cargo fmt --all --check
      - name: Патч форматирования
        if: ${{ failure() && steps.fmt.outcome == 'failure' }}
        run: cargo fmt --all && git diff > rustfmt.patch
      - if: ${{ failure() && steps.fmt.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustfmt-patch
          path: rustfmt.patch
          retention-days: 7
      - run: cargo clippy --workspace --all-targets --all-features --locked
      - uses: crate-ci/typos@00f422f3b19c57bc6338715ebfe3316d38768461 # v1.50.3

  lockfile:
    name: Cargo.lock
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: lock
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Обновлённый Cargo.lock
        if: ${{ failure() && steps.lock.outcome == 'failure' }}
        run: cargo metadata --format-version 1 > /dev/null
      - if: ${{ failure() && steps.lock.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Cargo.lock
          path: Cargo.lock
          retention-days: 7

  test:
    name: Тесты
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace --all-features --locked

  msrv:
    name: Минимальная версия Rust
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Версия из Cargo.toml
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - name: Установка
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: rustup toolchain install "$MSRV" --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Проверка сборки
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: cargo "+$MSRV" check --workspace --all-targets --all-features --locked

  deny:
    name: Лицензии и уязвимости зависимостей
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  workflows:
    name: Проверка workflow
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      HADOLINT_VERSION: 2.15.1
      HADOLINT_SHA256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # actionlint проверяет run-скрипты через shellcheck, если он есть.
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: shellcheck
      - name: actionlint
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" actionlint
          ./actionlint -color
      - name: hadolint
        run: |
          curl -fsSLo hadolint "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          echo "${HADOLINT_SHA256}  hadolint" | sha256sum -c -
          chmod +x hadolint
          ./hadolint Dockerfile
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false

  build:
    name: Сборка ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: armv7-unknown-linux-musleabihf
            runner: ubuntu-24.04
    env:
      TARGET: ${{ matrix.target }}
      CARGO_TARGET_ARMV7_UNKNOWN_LINUX_MUSLEABIHF_RUNNER: qemu-arm-static
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: clang и qemu
        run: sudo apt-get update -q && sudo apt-get install -y -q clang qemu-user-static
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - name: Сборка
        run: cargo build --release --locked --target "$TARGET"
      - name: Запуск
        run: |
          bin="target/$TARGET/release/raycat"
          case "$TARGET" in
            armv7-*) run() { qemu-arm-static "$@"; } ;;
            *) run() { "$@"; } ;;
          esac
          run "$bin" --version
          run "$bin" --help > /dev/null
          file "$bin"
          ls -l "$bin"
      - name: Тесты на целевой архитектуре
        if: ${{ !startsWith(matrix.target, 'x86_64') }}
        run: cargo test --locked --target "$TARGET"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: raycat-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/raycat
          retention-days: 14
          if-no-files-found: error

  image:
    name: Образ Docker (${{ matrix.arch }}${{ matrix.suffix }})
    needs: build
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            suffix: ""
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            xray_key: x86_64
            xray_archive: Xray-linux-64.zip
            xray_build: release
          - arch: arm64
            suffix: ""
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            xray_key: aarch64
            xray_archive: Xray-linux-arm64-v8a.zip
            xray_build: release
          - arch: arm64
            suffix: -noaes
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            xray_key: aarch64
            xray_archive: Xray-linux-arm64-v8a.zip
            xray_build: noaes
    env:
      ARCH: ${{ matrix.arch }}${{ matrix.suffix }}
      XRAY_KEY: ${{ matrix.xray_key }}
      XRAY_ARCHIVE: ${{ matrix.xray_archive }}
      XRAY_BUILD: ${{ matrix.xray_build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: raycat-${{ matrix.target }}
          path: dist/${{ matrix.arch }}
      - name: Сборка образа
        run: |
          bash .github/build/docker-args.sh "$XRAY_KEY" "$XRAY_ARCHIVE" "$XRAY_BUILD" > "$RUNNER_TEMP/docker-args.txt"
          mapfile -t args < "$RUNNER_TEMP/docker-args.txt"
          docker build "${args[@]}" --tag raycat:ci .
      - name: Дымовая проверка
        run: |
          docker run --rm raycat:ci --version
          version_output=$(docker run --rm --entrypoint /usr/libexec/raycat/xray raycat:ci version)
          echo "$version_output"
          if [ "$XRAY_BUILD" = noaes ]; then
            go_version=$(sed -n 's/^go_version = "\(.*\)"/\1/p' versions.toml)
            grep -qF "(go${go_version} " <<<"$version_output"
          fi
          for config in crates/xray/tests/golden/*.json; do
            echo "::group::${config}"
            docker run --rm -v "$PWD/crates/xray/tests/golden:/golden:ro" \
              --entrypoint /usr/libexec/raycat/xray raycat:ci run -test -c "/golden/$(basename "$config")"
            echo "::endgroup::"
          done
          docker run --rm --entrypoint nft raycat:ci --version
          docker run --rm --entrypoint ip raycat:ci -V
          volumes=$(docker image inspect -f '{{json .Config.Volumes}}' raycat:ci)
          test "$volumes" = null
          command=$(docker image inspect -f '{{json .Config.Entrypoint}} {{json .Config.Cmd}}' raycat:ci)
          test "$command" = '["raycat"] ["daemon"]'
          size=$(docker image inspect -f '{{.Size}}' raycat:ci)
          echo "Образ ${ARCH}: $((size / 1024 / 1024)) МиБ ($size байт)"
          echo "Образ ${ARCH}: $((size / 1024 / 1024)) МиБ" >> "$GITHUB_STEP_SUMMARY"
      - name: Сохранение образа
        run: docker save raycat:ci | gzip -9 > "$RUNNER_TEMP/image-${ARCH}.tar.gz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ matrix.arch }}${{ matrix.suffix }}
          path: ${{ runner.temp }}/image-${{ matrix.arch }}${{ matrix.suffix }}.tar.gz
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

  xray-noaes-armv7:
    name: xray для процессоров без AES (armv7)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: qemu
        run: sudo apt-get update -q && sudo apt-get install -y -q qemu-user-static
      - name: Сборка
        run: |
          bash .github/build/docker-args.sh armv7 Xray-linux-arm32-v7a.zip noaes > "$RUNNER_TEMP/docker-args.txt"
          mapfile -t args < "$RUNNER_TEMP/docker-args.txt"
          docker build --platform linux/arm/v7 "${args[@]}" --target xray-noaes --output type=local,dest=out .
      - name: Проверка
        run: |
          bin=out/out/xray
          file "$bin"
          ls -l "$bin"
          file "$bin" | grep -q 'ELF 32-bit.*ARM, EABI5'
          version_output=$(qemu-arm-static "$bin" version)
          echo "$version_output"
          go_version=$(sed -n 's/^go_version = "\(.*\)"/\1/p' versions.toml)
          grep -qF "(go${go_version} " <<<"$version_output"
          for config in crates/xray/tests/golden/*.json; do
            echo "::group::${config}"
            qemu-arm-static "$bin" run -test -c "$config"
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xray-noaes-armv7
          path: out/out/xray
          retention-days: 7
          if-no-files-found: error

  xray-config:
    name: Проверка конфигов xray
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Скачивание xray
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' versions.toml)
          sha256=$(sed -n 's/^x86_64 = "\(.*\)"/\1/p' versions.toml)
          test -n "$version" && test -n "$sha256"
          archive="Xray-linux-64.zip"
          curl -fsSLO "https://github.com/XTLS/Xray-core/releases/download/v${version}/${archive}"
          echo "${sha256}  ${archive}" | sha256sum -c -
          unzip -q "$archive" xray
          ./xray version
      - name: xray run -test
        run: |
          for config in crates/xray/tests/golden/*.json; do
            echo "::group::${config}"
            ./xray run -test -c "$config"
            echo "::endgroup::"
          done

  xray-api:
    name: API xray
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Скачивание xray
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' versions.toml)
          sha256=$(sed -n 's/^x86_64 = "\(.*\)"/\1/p' versions.toml)
          test -n "$version" && test -n "$sha256"
          archive="Xray-linux-64.zip"
          curl -fsSLO "https://github.com/XTLS/Xray-core/releases/download/v${version}/${archive}"
          echo "${sha256}  ${archive}" | sha256sum -c -
          unzip -q "$archive" xray
          ./xray version
      - name: Тесты клиента с настоящим xray
        env:
          XRAY_BIN: ./xray
        run: cargo test -p raycat-xray-api --locked

  e2e-proxy:
    name: "e2e: прокси"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Сборка
        run: cargo build --locked
      - name: Скачивание xray
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' versions.toml)
          sha256=$(sed -n 's/^x86_64 = "\(.*\)"/\1/p' versions.toml)
          test -n "$version" && test -n "$sha256"
          archive="Xray-linux-64.zip"
          curl -fsSLO "https://github.com/XTLS/Xray-core/releases/download/v${version}/${archive}"
          echo "${sha256}  ${archive}" | sha256sum -c -
          unzip -q "$archive" xray
          ./xray version
      - name: Стенд
        run: bash .github/e2e/proxy.sh

  nftables:
    name: Правила nftables
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: nftables и ping
        run: sudo apt-get update -q && sudo apt-get install -y -q nftables iputils-ping
      - name: Сборка
        run: cargo build --locked -p raycat-netfilter --example ctl
      - name: Стенд
        run: bash .github/e2e/netfilter.sh

  e2e-gateway:
    name: "e2e: шлюз"
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-amd64
          path: ${{ runner.temp }}/image
      - name: Загрузка образа
        env:
          IMAGE_DIR: ${{ runner.temp }}/image
        run: gunzip -c "$IMAGE_DIR/image-amd64.tar.gz" | docker load
      - name: Стенд
        run: bash .github/e2e/gateway.sh

  installer-lint:
    name: "Установщик: shellcheck"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: shellcheck
      - name: shellcheck
        run: |
          shellcheck --shell=sh deploy/install.sh .github/e2e/installer/container.sh
          shellcheck --shell=bash .github/e2e/installer/release.sh .github/e2e/installer/systemd.sh
      - name: Разбор dash и bash
        run: |
          dash -n deploy/install.sh
          dash -n .github/e2e/installer/container.sh
          bash -n .github/e2e/installer/release.sh
          bash -n .github/e2e/installer/systemd.sh

  installer:
    name: "Установщик: ${{ matrix.image }}"
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12-slim", "alpine:3.24"]
    env:
      IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: raycat-x86_64-unknown-linux-musl
          path: dist
      - name: Скачивание xray
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' versions.toml)
          sha256=$(sed -n 's/^x86_64 = "\(.*\)"/\1/p' versions.toml)
          test -n "$version" && test -n "$sha256"
          archive="Xray-linux-64.zip"
          curl -fsSLO "https://github.com/XTLS/Xray-core/releases/download/v${version}/${archive}"
          echo "${sha256}  ${archive}" | sha256sum -c -
          unzip -q "$archive" xray
          ./xray version
      - name: Ресурсы выпуска
        run: |
          chmod +x dist/raycat
          bash .github/e2e/installer/release.sh "$RUNNER_TEMP/release" 0.9.0 dist/raycat ./xray
          bash .github/e2e/installer/release.sh "$RUNNER_TEMP/release2" 0.9.1 dist/raycat ./xray pad
      - name: Стенд
        run: |
          docker run --rm \
            -v "$PWD/.github/e2e/installer:/e2e:ro" \
            -v "$PWD/deploy:/repo/deploy:ro" \
            -v "$RUNNER_TEMP/release:/release:ro" \
            -v "$RUNNER_TEMP/release2:/release2:ro" \
            "$IMAGE" sh /e2e/container.sh

  installer-systemd:
    name: "Установщик: systemd"
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: raycat-x86_64-unknown-linux-musl
          path: dist
      - name: Скачивание xray
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' versions.toml)
          sha256=$(sed -n 's/^x86_64 = "\(.*\)"/\1/p' versions.toml)
          test -n "$version" && test -n "$sha256"
          archive="Xray-linux-64.zip"
          curl -fsSLO "https://github.com/XTLS/Xray-core/releases/download/v${version}/${archive}"
          echo "${sha256}  ${archive}" | sha256sum -c -
          unzip -q "$archive" xray
          ./xray version
      - name: nftables
        run: sudo apt-get update -q && sudo apt-get install -y -q nftables
      - name: Ресурсы выпуска
        run: |
          chmod +x dist/raycat
          bash .github/e2e/installer/release.sh "$RUNNER_TEMP/release" 0.9.0 dist/raycat ./xray
          bash .github/e2e/installer/release.sh "$RUNNER_TEMP/release2" 0.9.1 dist/raycat ./xray pad
      - name: Стенд
        run: bash .github/e2e/installer/systemd.sh "$RUNNER_TEMP/release" "$RUNNER_TEMP/release2"

  e2e-lan:
    name: "e2e: шлюз для локальной сети"
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-amd64
          path: ${{ runner.temp }}/image
      - name: Загрузка образа
        env:
          IMAGE_DIR: ${{ runner.temp }}/image
        run: gunzip -c "$IMAGE_DIR/image-amd64.tar.gz" | docker load
      - name: Стенд
        run: bash .github/e2e/lan.sh

  result:
    name: Итог
    if: ${{ always() }}
    needs: [lint, lockfile, test, msrv, deny, workflows, build, image, xray-noaes-armv7, xray-config, xray-api, e2e-proxy, nftables, e2e-gateway, e2e-lan, installer-lint, installer, installer-systemd]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Все проверки пройдены
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: test "$FAILED" = false
