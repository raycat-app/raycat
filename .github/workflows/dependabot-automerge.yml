name: Dependabot

on:
  pull_request:

permissions: {}

jobs:
  automerge:
    name: Автослияние
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Заголовок по-русски
        id: title
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.html_url }}
          NAMES: ${{ steps.meta.outputs.dependency-names }}
          FROM: ${{ steps.meta.outputs.previous-version }}
          TO: ${{ steps.meta.outputs.new-version }}
        run: |
          if [ -n "$FROM" ] && [ -n "$TO" ]; then
            title="chore(deps): обновить $NAMES с $FROM до $TO"
          else
            title="chore(deps): обновить $NAMES"
          fi
          gh pr edit "$PR" --title "$title"
          printf 'title=%s\n' "$title" >> "$GITHUB_OUTPUT"
      - name: Автослияние после зелёного CI
        if: ${{ steps.meta.outputs.update-type != 'version-update:semver-major' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.html_url }}
          NUMBER: ${{ github.event.pull_request.number }}
          TITLE: ${{ steps.title.outputs.title }}
        run: |
          gh pr merge "$PR" --auto --squash \
            --subject "$TITLE (#$NUMBER)" \
            --body "Обновление зависимости."
