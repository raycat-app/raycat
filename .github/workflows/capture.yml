name: Захват запросов приложений

# Лаборатория: настоящие приложения (Happ, INCY) запрашивают подписку у локального
# сервера .github/capture/capture_server.py, запросы сохраняются как артефакты и
# служат образцами для профилей запросов raycat. Ничего не публикуется.
#
# Вызывается и вручную, и из client-update.yml (бот обновляет профили). Значение none
# вместо версии пропускает приложение, пустое значение (запуск по push) — latest.

on:
  push:
    branches: ["lab/**"]
  workflow_dispatch:
    inputs:
      happ_windows:
        description: Версия Happ для Windows (тег релиза Happ-proxy/happ-desktop, latest или none)
        default: latest
      happ_android:
        description: Версия Happ для Android (тег релиза Happ-proxy/happ-android, latest или none)
        default: latest
      incy_android:
        description: Версия INCY для Android (тег релиза INCY-DEV/incy-platforms, latest или none)
        default: latest
  workflow_call:
    inputs:
      happ_windows:
        description: Тег релиза Happ-proxy/happ-desktop или none
        type: string
        default: none
      happ_android:
        description: Тег релиза Happ-proxy/happ-android или none
        type: string
        default: none
      incy_android:
        description: Тег релиза INCY-DEV/incy-platforms или none
        type: string
        default: none

permissions: {}

jobs:
  happ-windows:
    name: Happ Windows ${{ matrix.arch }}${{ matrix.odd && ' (нечётный день)' || '' }}
    if: ${{ inputs.happ_windows != 'none' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Часы ставятся всегда: чётное число по Москве даёт маркер «6», нечётное — «5»,
          # и по паре запросов видно, где в User-Agent маркер. Дата не зависит от дня запуска.
          - {arch: x64, runner: windows-latest, date: "2026-09-28 12:00:00"}
          - {arch: arm64, runner: windows-11-arm, date: "2026-09-28 12:00:00"}
          - {arch: x64, runner: windows-latest, date: "2026-09-29 12:00:00", odd: true}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Установщик
        id: app
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.happ_windows }}
          ARCH: ${{ matrix.arch }}
        run: |
          version=${REQUESTED:-latest}
          if [ "$version" = latest ]; then
            version=$(gh release list -R Happ-proxy/happ-desktop --limit 1 --json tagName --jq '.[0].tagName')
          fi
          [[ "$version" =~ ^[0-9A-Za-z._-]+$ ]] || { echo "неверная версия: $version"; exit 1; }
          gh release download "$version" -R Happ-proxy/happ-desktop -p "setup-Happ.${ARCH}.exe"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Захват
        shell: pwsh
        env:
          ARCH: ${{ matrix.arch }}
          CAPTURE_DATE: ${{ matrix.date }}
        run: |
          $server = Start-Process python -ArgumentList ".github/capture/capture_server.py", "--host", "127.0.0.1", "--port", "18080", "--out", "captures" -PassThru -RedirectStandardOutput server.log
          Start-Sleep 2
          ./.github/capture/windows.ps1 -Installer "setup-Happ.$env:ARCH.exe" -Link "happ://add/http://127.0.0.1:18080/sub/capture-windows" -Out captures -Date $env:CAPTURE_DATE
          Stop-Process $server -Force
          Get-Content server.log
          Copy-Item server.log captures/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: capture-happ-windows-${{ matrix.arch }}-${{ steps.app.outputs.version }}${{ matrix.odd && '-odd-day' || '' }}
          path: captures
          if-no-files-found: error
      - name: Есть ли захват
        shell: bash
        run: ls captures/*.http

  # Какие из прогонов Android нужны: пропущенное приложение (none) в матрицу не попадает.
  plan:
    name: План захвата Android
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      android: ${{ steps.matrix.outputs.android }}
    steps:
      - id: matrix
        env:
          HAPP: ${{ inputs.happ_android }}
          INCY: ${{ inputs.incy_android }}
        run: |
          # Чётное и нечётное число: маркер дня в User-Agent меняется, по паре видно его место.
          happ='{"app":"Happ","repo":"Happ-proxy/happ-android","asset":"Happ.apk","scheme":"happ","hosts":"10.0.2.2","date":"092812002026.00"}'
          happ_odd='{"app":"Happ","repo":"Happ-proxy/happ-android","asset":"Happ.apk","scheme":"happ","hosts":"10.0.2.2","date":"092912002026.00","odd":true}'
          incy='{"app":"INCY","repo":"INCY-DEV/incy-platforms","asset":"Incy.apk","scheme":"incy","hosts":"127.0.0.1 localhost 10.0.2.2","tls":true}'
          items=()
          [ "$HAPP" = none ] || items+=("$happ" "$happ_odd")
          [ "$INCY" = none ] || items+=("$incy")
          list=$(IFS=,; echo "${items[*]}")
          echo "android=[$list]" >> "$GITHUB_OUTPUT"

  android:
    name: ${{ matrix.app }} Android${{ matrix.odd && ' (нечётный день)' || '' }}
    needs: plan
    if: ${{ needs.plan.outputs.android != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.android) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: APK
        id: app
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ matrix.scheme == 'happ' && inputs.happ_android || inputs.incy_android }}
          REPO: ${{ matrix.repo }}
          ASSET: ${{ matrix.asset }}
        run: |
          tag=${REQUESTED:-latest}
          if [ "$tag" = latest ]; then
            tag=$(gh release list -R "$REPO" --limit 1 --json tagName --jq '.[0].tagName')
          fi
          [[ "$tag" =~ ^[0-9A-Za-z._-]+$ ]] || { echo "неверная версия: $tag"; exit 1; }
          gh release download "$tag" -R "$REPO" -p "$ASSET"
          aapt=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          version=$("$aapt" dump badging "$ASSET" | sed -n "s/^package:.* versionName='\([^']*\)'.*/\1/p" | head -1)
          echo "tag=$tag version=${version:-?}"
          echo "version=${version:-$tag}" >> "$GITHUB_OUTPUT"
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Сервер захвата
        env:
          TLS: ${{ matrix.tls }}
          TLS_DIR: ${{ runner.temp }}/capture-tls
        run: |
          args=()
          if [ -n "$TLS" ]; then
            bash .github/capture/certs.sh "$TLS_DIR"
            args=(--cert "$TLS_DIR/server.pem" --key "$TLS_DIR/server.key")
          fi
          python3 .github/capture/capture_server.py --port 18080 --out captures "${args[@]}" > server.log 2>&1 &
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          APK: ${{ matrix.asset }}
          DATE: ${{ matrix.date }}
          SCHEME: ${{ matrix.scheme }}
          HOSTS: ${{ matrix.hosts }}
          PROTO: ${{ matrix.tls && 'https' || 'http' }}
          CA_CERT: ${{ matrix.tls && format('{0}/capture-tls/ca.pem', runner.temp) || '' }}
          OUT: captures
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash .github/capture/android.sh
      - if: ${{ always() }}
        run: cat server.log && cp server.log captures/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: capture-${{ matrix.scheme }}-android-x86_64-${{ steps.app.outputs.version }}${{ matrix.odd && '-odd-day' || '' }}
          path: captures
          if-no-files-found: error
      - name: Есть ли захват
        run: ls captures/*.http
