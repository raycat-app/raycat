name: Обновление xray

# Раз в час берёт самый новый релиз XTLS/Xray-core и, если он новее .github/versions.toml, открывает
# PR бота «build: xray <версия>»: версия и суммы архивов linux, а также версия и коммит тега в
# секции [xray.noaes] (сборка noaes идёт на той же версии). Обязательные проверки бот запускает
# сам и сливает PR, если они зелёные. Если что-то не вышло, заводится issue (одно на версию).
# Пока открыт свежий (моложе часа) PR бота, у которого проверки не упали, новая версия не предлагается.
# Упавший PR или PR, не менявшийся больше часа, обновляется поверх: та же ветка и тот же PR. Версия,
# PR которой закрыли без слияния, не предлагается снова. Версия только вперёд.
#
# Ручной запуск: version — конкретная версия без v (пусто — последняя), dry_run — только
# собрать .github/versions.toml в артефакт xray-update, без ветки и PR.
#
# Ветку, PR и слияние бот делает токеном приложения (vars.RELEASE_APP_CLIENT_ID,
# secrets.RELEASE_APP_KEY): его события, в отличие от GITHUB_TOKEN, запускают обычные проверки PR.
# Бот ждёт обязательные проверки ruleset («Итог» и «Заголовок PR») и сливает PR; слияние само
# запускает CI на main и dev-выпуск.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      version:
        description: Версия xray без v (пусто — последняя опубликованная)
        type: string
        default: ""
      dry_run:
        description: Только собрать .github/versions.toml в артефакт, без ветки и PR
        type: boolean
        default: false

permissions: {}

concurrency:
  group: xray-update
  cancel-in-progress: false

jobs:
  update:
    name: Версия и PR
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      checks: read
      contents: write
      pull-requests: write
      statuses: read
    outputs:
      version: ${{ steps.target.outputs.version }}
      pr: ${{ steps.pr.outputs.number }}
      sha: ${{ steps.commit.outputs.sha }}
      branch: ${{ steps.commit.outputs.branch }}
    env:
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Новая версия
        id: target
        env:
          INPUT_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          current=$(sed -n '/^\[xray\]$/,/^\[/ s/^version = "\(.*\)"$/\1/p' .github/versions.toml)
          [ -n "$current" ] || { echo "::error::версия xray в .github/versions.toml не прочитана"; exit 1; }
          echo "current=$current" >> "$GITHUB_OUTPUT"
          gh api "repos/XTLS/Xray-core/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          version=$(bash .github/xray/select.sh "$RUNNER_TEMP/releases.json" "$current" "$INPUT_VERSION")
          if [ -n "$version" ] && [ "$DRY_RUN" != true ]; then
            open=$(gh pr list -R "$REPO" --state open --limit 200 --json number,headRefName,updatedAt,statusCheckRollup --jq '[.[] | select(.headRefName | startswith("bot/xray-"))]')
            decision=$(printf '%s' "$open" | bash .github/bots/pr.sh "$(date -u +%s)" 3600)
            known=$(gh pr list -R "$REPO" --head "bot/xray-$version" --state all --json state --jq '[.[] | select(.state != "OPEN")] | length')
            if [[ "$decision" == wait:* ]]; then
              echo "::notice::открыт свежий PR бота xray ($decision), версия $version подождёт его слияния"
              version=
            elif [ "$known" != 0 ]; then
              echo "::notice::PR для xray $version уже был и закрыт, новый не открывается"
              version=
            else
              echo "::notice::$decision"
            fi
          fi
          [ -n "$version" ] || echo "::notice::новой версии xray нет (в .github/versions.toml $current)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Архивы и .dgst
        if: ${{ steps.target.outputs.version != '' }}
        env:
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/xray"
          for archive in Xray-linux-64.zip Xray-linux-arm64-v8a.zip Xray-linux-arm32-v7a.zip; do
            for file in "$archive" "$archive.dgst"; do
              curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/xray/$file" "https://github.com/XTLS/Xray-core/releases/download/v$VERSION/$file"
            done
          done
      - name: .github/versions.toml
        if: ${{ steps.target.outputs.version != '' }}
        env:
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          commit=$(gh api "repos/XTLS/Xray-core/commits/v$VERSION" --jq .sha)
          bash .github/xray/update.sh "$VERSION" "$RUNNER_TEMP/xray" "$commit"
      - name: Описание
        if: ${{ steps.target.outputs.version != '' }}
        env:
          OLD: ${{ steps.target.outputs.current }}
          NEW: ${{ steps.target.outputs.version }}
        run: |
          {
            echo "Xray-core обновлён с версии $OLD до $NEW."
            echo
            echo "- релиз: https://github.com/XTLS/Xray-core/releases/tag/v$NEW"
            echo "- прогон: $RUN_URL"
            echo
            echo "В .github/versions.toml меняются версия и sha256 архивов linux (x86_64, aarch64, armv7), а также"
            echo "версия и коммит тега в [xray.noaes]: сборка -noaes собирается из той же версии xray."
            echo
            echo "Коммиты XTLS после v$OLD:"
            echo
            gh api "repos/XTLS/Xray-core/compare/v$OLD...v$NEW" --jq '"- всего коммитов: \(.total_commits)", (.commits[0:40][] | "- " + (.commit.message | split("\n")[0]))' || echo "- список коммитов не получен"
          } > "$RUNNER_TEMP/body.md"
      - name: Артефакт (dry_run)
        if: ${{ steps.target.outputs.version != '' && inputs.dry_run }}
        run: |
          mkdir -p "$RUNNER_TEMP/dry-run"
          cp .github/versions.toml "$RUNNER_TEMP/dry-run/versions.toml"
          cp "$RUNNER_TEMP/body.md" "$RUNNER_TEMP/dry-run/body.md"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ steps.target.outputs.version != '' && inputs.dry_run }}
        with:
          name: xray-update
          path: ${{ runner.temp }}/dry-run
          if-no-files-found: error
          retention-days: 14
      # Ветку, PR и слияние бот делает токеном приложения: в отличие от событий
      # GITHUB_TOKEN, его события запускают обычные проверки PR и CI на main после слияния.
      - id: app
        if: ${{ steps.target.outputs.version != '' && !inputs.dry_run }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - name: Коммит и ветка бота
        id: commit
        if: ${{ steps.target.outputs.version != '' && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          git diff --quiet -- .github/versions.toml && { echo "::error::.github/versions.toml не изменился"; exit 1; }
          branch="bot/xray-$VERSION"
          title="build: xray $VERSION"
          { echo "$title"; echo; cat "$RUNNER_TEMP/body.md"; } > "$RUNNER_TEMP/message.txt"
          git config user.name sleepyhead-dev
          git config user.email 184401951+sleepyhead-dev@users.noreply.github.com
          git switch -c "$branch"
          git add .github/versions.toml
          git commit -q -F "$RUNNER_TEMP/message.txt"
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push --force origin "$branch"
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "branch=$branch"
            echo "title=$title"
          } >> "$GITHUB_OUTPUT"
      - name: Pull request
        id: pr
        if: ${{ steps.target.outputs.version != '' && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BRANCH: ${{ steps.commit.outputs.branch }}
          TITLE: ${{ steps.commit.outputs.title }}
        run: |
          number=$(gh pr list -R "$REPO" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" -R "$REPO" --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"
          else
            base=$(gh api "repos/$REPO" --jq .default_branch)
            output=$(gh pr create -R "$REPO" --base "$base" --head "$BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/body.md" --label зависимости)
            number=$(printf '%s\n' "$output" | tail -n 1)
            number=${number##*/}
          fi
          [[ "$number" =~ ^[0-9]+$ ]] || { echo "::error::номер PR не определён"; exit 1; }
          echo "number=$number" >> "$GITHUB_OUTPUT"
      - name: Устаревшие PR
        if: ${{ steps.target.outputs.version != '' && !inputs.dry_run }}
        env:
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          gh pr list -R "$REPO" --state open --limit 200 --json number,headRefName > "$RUNNER_TEMP/open.json"
          bash .github/bots/superseded.sh "$VERSION" "bot/xray-" < "$RUNNER_TEMP/open.json" > "$RUNNER_TEMP/superseded.txt"
          while IFS=$'\t' read -r old _; do
            gh pr close "$old" -R "$REPO" --delete-branch --comment "Вышла версия $VERSION, закрываю."
          done < "$RUNNER_TEMP/superseded.txt"

  verify:
    name: Проверки и слияние
    needs: update
    if: ${{ needs.update.outputs.pr != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      checks: read
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ needs.update.outputs.pr }}
      SHA: ${{ needs.update.outputs.sha }}
      BRANCH: ${{ needs.update.outputs.branch }}
    steps:
      # Ветку, PR и слияние бот делает токеном приложения: в отличие от событий
      # GITHUB_TOKEN, его события запускают обычные проверки PR и CI на main после слияния.
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - name: Ожидание проверок PR
        run: |
          # PR открыт токеном приложения, на нём идут обычные проверки. Бот ждёт
          # обязательные из ruleset — «Заголовок PR» и «Итог» — на своём коммите.
          state() {
            gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" |
              jq -r --arg name "$1" '[.check_runs[] | select(.name == $name)] | sort_by(.started_at) | last | if . == null then "нет" else "\(.status) \(.conclusion)" end'
          }
          for _ in $(seq 1 160); do
            title=$(state "Заголовок PR")
            total=$(state "Итог")
            echo "Заголовок PR: $title; Итог: $total"
            if [[ $title == completed* && $total == completed* ]]; then
              [ "$title" = "completed success" ] && [ "$total" = "completed success" ]
              exit
            fi
            sleep 30
          done
          echo "::error::проверки PR не закончились за 80 минут"
          exit 1
      - name: Слияние
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          title=$(gh pr view "$PR" -R "$REPO" --json title --jq .title)
          body=$(gh pr view "$PR" -R "$REPO" --json body --jq .body)
          gh pr merge "$PR" -R "$REPO" --squash --delete-branch --match-head-commit "$SHA" --subject "$title (#$PR)" --body "$body"

  report:
    name: Отчёт об ошибке
    needs: [update, verify]
    if: ${{ failure() && needs.update.outputs.version != '' && !inputs.dry_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      VERSION: ${{ needs.update.outputs.version }}
      UPDATE: ${{ needs.update.result }}
      VERIFY: ${{ needs.verify.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Issue
        run: |
          title="Не удалось обновить xray до $VERSION"
          {
            echo "Автоматическое обновление xray не дошло до слияния."
            echo
            echo "- версия и PR: $UPDATE"
            echo "- проверки и слияние: $VERIFY"
            echo "- прогон: $RUN_URL"
          } > body.md
          existing=$(gh issue list -R "$REPO" --state open --label зависимости --json number,title |
            jq -r --arg title "$title" '[.[] | select(.title == $title)][0].number // empty')
          if [ -n "$existing" ]; then
            last=$(gh issue view "$existing" -R "$REPO" --json comments --jq '.comments | last | .author.login // ""')
            if [ "$last" = github-actions ]; then
              gh issue comment "$existing" -R "$REPO" --edit-last --body-file body.md
            else
              gh issue comment "$existing" -R "$REPO" --body-file body.md
            fi
          else
            gh issue create -R "$REPO" --title "$title" --body-file body.md --label зависимости --label ci
          fi
