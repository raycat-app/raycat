# Сборка xray для процессоров без аппаратного AES (Raspberry Pi 3/4, многие armv7). Тулчейн Go
# собирается из исходников тега go_version (коммит go_commit) с патчем .github/build/go-noaes.patch:
# он отменяет константный по времени GHASH из Go 1.27, из-за которого AES-GCM без AES-инструкций
# на 40–50% медленнее. Версия и коммит совпадают с [xray]: бот обновляет их вместе. go_image —
# образ-бутстрап тулчейна, закреплён по digest индекса (многоархитектурного манифеста).
[xray.noaes]
version = "26.10.31"
commit = "a4a3dff5b20c2faae567b742c172c7b95e75c083"
go_version = "1.27.3"
go_commit = "2aae1000ea1d4b28923b96db28acf4e3b99d6aff"
go_image = "golang:1.27.3-alpine@sha256:f2c872bcee949b7be9c490efd02b48a8a2fbf947cdf533f1c58525ec9d8170fd"
