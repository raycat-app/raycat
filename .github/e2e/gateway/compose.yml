# Стенд шлюза: приложение ходит на сайт только через шлюз raycat и узел.
#
#   wan   — шлюз, панель, узлы, «прямая» цель (canary): сеть с выходом наружу
#   inet  — узлы и сайт: изолированная сеть, шлюз в ней не состоит
#
# Адреса нарочно не из частных диапазонов: частные сети шлюз пропускает мимо
# перехвата, а xray (freedom) не пускает узел на зарезервированные адреса.
name: raycat-e2e

networks:
  wan:
    name: raycat-e2e-wan
    ipam:
      config:
        - subnet: 11.30.0.0/24
  inet:
    name: raycat-e2e-inet
    internal: true
    ipam:
      config:
        - subnet: 11.40.0.0/24

volumes:
  state:
  state2:

# Служебные контейнеры из того же образа не шлюзы: HEALTHCHECK образа у них провалился бы.
x-idle-health: &idle-health
  test: ["CMD", "true"]
  interval: 2s
  timeout: 2s
  retries: 3
  start_period: 10s
  start_interval: 500ms

# Шлюз ждёт, пока панель начнёт отвечать: при отказе в соединении демон повторяет запрос
# только через 30 с.
x-after-panel: &after-panel
  panel:
    condition: service_healthy
  node1:
    condition: service_started
  node2:
    condition: service_started
  site:
    condition: service_started
  canary:
    condition: service_started

x-node: &node
  image: raycat:ci
  entrypoint: ["/usr/libexec/raycat/xray"]
  command: ["run", "-c", "/e2e/gateway/node.json"]
  healthcheck: *idle-health
  volumes:
    - ..:/e2e:ro

services:
  site:
    image: python:3.13-alpine
    command: ["python", "/e2e/echo.py"]
    volumes:
      - ..:/e2e:ro
    networks:
      inet:
        ipv4_address: 11.40.0.10
        aliases:
          - site.e2e.test

  canary:
    image: python:3.13-alpine
    command: ["python", "/e2e/echo.py"]
    volumes:
      - ..:/e2e:ro
    networks:
      wan:
        ipv4_address: 11.30.0.50

  panel:
    image: python:3.13-alpine
    command:
      - python
      - /e2e/panel.py
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --body
      - /e2e/gateway/subscription.txt
      - --requests
      - /tmp/requests.log
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8080), 1).close()"]
      interval: 1s
      timeout: 2s
      retries: 30
    volumes:
      - ..:/e2e:ro
    networks:
      wan:
        ipv4_address: 11.30.0.5

  node1:
    <<: *node
    networks:
      wan:
        ipv4_address: 11.30.0.11
      inet:
        ipv4_address: 11.40.0.11

  node2:
    <<: *node
    networks:
      wan:
        ipv4_address: 11.30.0.12
      inet:
        ipv4_address: 11.40.0.12

  # Настройки, которые советует README: корень только для чтения, без лишних привилегий.
  # Проверка готовности — HEALTHCHECK самого образа.
  raycat:
    image: raycat:ci
    container_name: raycat-e2e-gateway
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    # Явный DNS: Docker опрашивает его из пространства контейнера, где запросы
    # перехватываются. Без него имена разрешаются через хост, мимо перехвата.
    dns: [1.1.1.1]
    environment:
      RAYCAT_CONFIG: /e2e/gateway/config.toml
    volumes:
      - ..:/e2e:ro
      - state:/var/lib/raycat
    networks:
      wan:
        ipv4_address: 11.30.0.2
    depends_on: *after-panel

  app:
    image: raycat:ci
    container_name: raycat-e2e-app
    entrypoint: ["sleep", "infinity"]
    healthcheck: *idle-health
    # sleep без init не реагирует на SIGTERM, и перезапуск ждал бы 10 с до SIGKILL.
    stop_grace_period: 1s
    network_mode: service:raycat
    depends_on:
      raycat:
        condition: service_healthy
        restart: true

  # Жизненный цикл правил: сетевое пространство держит holder, шлюз gw2 живёт в нём
  # и может быть остановлен штатно или убит, а правила можно проверить снаружи.
  holder:
    profiles: [lifecycle]
    image: raycat:ci
    container_name: raycat-e2e-holder
    entrypoint: ["sleep", "infinity"]
    healthcheck: *idle-health
    cap_add: [NET_ADMIN]
    dns: [1.1.1.1]
    networks:
      wan:
        ipv4_address: 11.30.0.3

  gw2:
    profiles: [lifecycle]
    image: raycat:ci
    container_name: raycat-e2e-gw2
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    environment:
      RAYCAT_CONFIG: /e2e/gateway/config.toml
    volumes:
      - ..:/e2e:ro
      - state2:/var/lib/raycat
    network_mode: service:holder
    depends_on:
      <<: *after-panel
      holder:
        condition: service_started
