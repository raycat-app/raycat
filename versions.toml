go_commit = "2aae1000ea1d4b28923b96db28acf4e3b99d6aff"
go_image = "golang:1.27.3-alpine@sha256:f2c872bcee949b7be9c490efd02b48a8a2fbf947cdf533f1c58525ec9d8170fd"
