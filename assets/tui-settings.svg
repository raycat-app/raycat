<svg xmlns="http://www.w3.org/2000/svg" width="900" height="630" viewBox="0 0 9000 6300" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &quot;DejaVu Sans Mono&quot;, monospace">
<defs><clipPath id="window"><rect x="160" y="160" width="8680" height="5980" rx="100"/></clipPath></defs>
<rect x="160" y="160" width="8680" height="5980" rx="100" fill="#1e1e2e" stroke="#313244" stroke-width="10"/>
<rect x="160" y="160" width="8680" height="360" fill="#181825" clip-path="url(#window)"/>
<circle cx="360" cy="340" r="60" fill="#f38ba8"/>
<circle cx="560" cy="340" r="60" fill="#f9e2af"/>
<circle cx="760" cy="340" r="60" fill="#a6e3a1"/>
<text x="4500" y="385" text-anchor="middle" font-size="130" fill="#6c7086">raycat</text>
<g font-size="140">
<rect x="3912" y="620" width="1092" height="180" fill="#cdd6f4"/>
<rect x="300" y="980" width="1428" height="180" fill="#cdd6f4"/>
<rect x="2568" y="980" width="420" height="180" fill="#cdd6f4"/>
<rect x="4920" y="980" width="672" height="180" fill="#cdd6f4"/>
<rect x="468" y="1160" width="4284" height="180" fill="#cdd6f4"/>
<text x="300" y="750" textLength="3444" xml:space="preserve" fill="#cdd6f4"> 1 Обзор   2 Узлы   3 Подписки   4 Журнал</text>
<text x="3912" y="750" textLength="1008" xml:space="preserve" fill="#1e1e2e" font-weight="bold"> 5 Настройки</text>
<text x="300" y="930" textLength="504" xml:space="preserve" fill="#cdd6f4" font-weight="bold">raycat</text>
<text x="804" y="930" textLength="168" xml:space="preserve" fill="#cdd6f4" fill-opacity="0.6"> ·</text>
<text x="1056" y="930" textLength="336" xml:space="preserve" fill="#cdd6f4">шлюз</text>
<text x="1392" y="930" textLength="168" xml:space="preserve" fill="#cdd6f4" fill-opacity="0.6"> ·</text>
<text x="1644" y="930" textLength="1176" xml:space="preserve" fill="#a6e3a1">● VPN работает</text>
<text x="2820" y="930" textLength="168" xml:space="preserve" fill="#cdd6f4" fill-opacity="0.6"> ·</text>
<text x="3072" y="930" textLength="1092" xml:space="preserve" fill="#a6e3a1">kill switch ●</text>
<text x="6768" y="930" textLength="1932" xml:space="preserve" fill="#cdd6f4" fill-opacity="0.6">время работы 3 ч 12 мин</text>
<text x="300" y="1110" textLength="1428" xml:space="preserve" fill="#1e1e2e" font-weight="bold">▶ Россия напрямую</text>
<text x="2568" y="1110" textLength="420" xml:space="preserve" fill="#1e1e2e" font-weight="bold">[вкл]</text>
<text x="4920" y="1110" textLength="672" xml:space="preserve" fill="#1e1e2e" font-weight="bold">из файла</text>
<text x="468" y="1290" textLength="4284" xml:space="preserve" fill="#1e1e2e" font-weight="bold">российские домены и подсети идут напрямую, мимо VPN</text>
<text x="468" y="1470" textLength="924" xml:space="preserve" fill="#cdd6f4" font-weight="bold">Kill switch</text>
<text x="2568" y="1470" textLength="420" xml:space="preserve" fill="#cdd6f4" font-weight="bold">[вкл]</text>
<text x="4920" y="1470" textLength="1008" xml:space="preserve" fill="#cdd6f4" fill-opacity="0.6">по умолчанию</text>
<text x="468" y="1650" textLength="3864" xml:space="preserve" fill="#cdd6f4" fill-opacity="0.6">не пускать трафик мимо VPN, пока он недоступен</text>
<text x="468" y="1830" textLength="1764" xml:space="preserve" fill="#cdd6f4" font-weight="bold">Проверка узлов каждые</text>
<text x="2568" y="1830" textLength="420" xml:space="preserve" fill="#cdd6f4" font-weight="bold">[30s]</text>
<text x="4920" y="1830" textLength="1008" xml:space="preserve" fill="#cdd6f4" fill-opacity="0.6">по умолчанию</text>
<text x="468" y="2010" textLength="3192" xml:space="preserve" fill="#cdd6f4" fill-opacity="0.6">как часто проверять узлы, от 5s до 10m</text>
<text x="468" y="2190" textLength="1764" xml:space="preserve" fill="#cdd6f4" font-weight="bold">Сбоев до переключения</text>
<text x="2568" y="2190" textLength="252" xml:space="preserve" fill="#cdd6f4" font-weight="bold">[3]</text>
<text x="4920" y="2190" textLength="672" xml:space="preserve" fill="#cdd6f4" fill-opacity="0.6">из файла</text>
<text x="468" y="2370" textLength="3612" xml:space="preserve" fill="#cdd6f4" fill-opacity="0.6">проверок подряд без ответа до недоступности</text>
<text x="468" y="2550" textLength="1512" xml:space="preserve" fill="#cdd6f4" font-weight="bold">Порог переключения</text>
<text x="2568" y="2550" textLength="588" xml:space="preserve" fill="#cdd6f4" font-weight="bold">[150ms]</text>
<text x="4920" y="2550" textLength="1008" xml:space="preserve" fill="#cdd6f4" fill-opacity="0.6">по умолчанию</text>
<text x="468" y="2730" textLength="4284" xml:space="preserve" fill="#cdd6f4" fill-opacity="0.6">на сколько узел должен быть быстрее, например 150ms</text>
<text x="468" y="2910" textLength="1932" xml:space="preserve" fill="#cdd6f4" font-weight="bold">Возврат на приоритетный</text>
<text x="2568" y="2910" textLength="336" xml:space="preserve" fill="#cdd6f4" font-weight="bold">[5m]</text>
<text x="4920" y="2910" textLength="1008" xml:space="preserve" fill="#cdd6f4" fill-opacity="0.6">по умолчанию</text>
<text x="468" y="3090" textLength="3696" xml:space="preserve" fill="#cdd6f4" fill-opacity="0.6">через сколько вернуться на приоритетный узел</text>
<text x="468" y="3270" textLength="1344" xml:space="preserve" fill="#cdd6f4" font-weight="bold">Соединения XHTTP</text>
<text x="2568" y="3270" textLength="1512" xml:space="preserve" fill="#cdd6f4" font-weight="bold">[как у провайдера]</text>
<text x="4920" y="3270" textLength="1008" xml:space="preserve" fill="#cdd6f4" fill-opacity="0.6">по умолчанию</text>
<text x="468" y="3450" textLength="4284" xml:space="preserve" fill="#cdd6f4" fill-opacity="0.6">параллельные соединения для узлов XHTTP, от 1 до 16</text>
<text x="468" y="3630" textLength="1260" xml:space="preserve" fill="#cdd6f4" font-weight="bold">Уровень журнала</text>
<text x="2568" y="3630" textLength="420" xml:space="preserve" fill="#cdd6f4" fill-opacity="0.6">error</text>
<text x="3156" y="3630" textLength="504" xml:space="preserve" fill="#cdd6f4" font-weight="bold">[warn]</text>
<text x="3828" y="3630" textLength="336" xml:space="preserve" fill="#cdd6f4" fill-opacity="0.6">info</text>
<text x="4332" y="3630" textLength="420" xml:space="preserve" fill="#cdd6f4" fill-opacity="0.6">debug</text>
<text x="4920" y="3630" textLength="672" xml:space="preserve" fill="#cdd6f4" fill-opacity="0.6">из файла</text>
<text x="468" y="3810" textLength="4620" xml:space="preserve" fill="#cdd6f4" fill-opacity="0.6">что писать в журнал демона: error, warn, info или debug</text>
<text x="468" y="3990" textLength="1260" xml:space="preserve" fill="#cdd6f4" font-weight="bold">Значки в именах</text>
<text x="2568" y="3990" textLength="1008" xml:space="preserve" fill="#cdd6f4" font-weight="bold">[код страны]</text>
<text x="4920" y="3990" textLength="588" xml:space="preserve" fill="#cdd6f4" fill-opacity="0.6">вид TUI</text>
<text x="468" y="4170" textLength="3024" xml:space="preserve" fill="#cdd6f4" fill-opacity="0.6">код страны вместо флага, например DE</text>
<text x="300" y="5610" textLength="6972" xml:space="preserve" fill="#cdd6f4" fill-opacity="0.6">Файл настроек: не найден  Остальные настройки — в файле, raycat config покажет итог</text>
<text x="300" y="5790" textLength="420" xml:space="preserve" fill="#cdd6f4" fill-opacity="0.6">готов</text>
<text x="300" y="5970" textLength="168" xml:space="preserve" fill="#cdd6f4" font-weight="bold">↑↓</text>
<text x="552" y="5970" textLength="420" xml:space="preserve" fill="#cdd6f4" fill-opacity="0.6">выбор</text>
<text x="1140" y="5970" textLength="420" xml:space="preserve" fill="#cdd6f4" font-weight="bold">Enter</text>
<text x="1644" y="5970" textLength="672" xml:space="preserve" fill="#cdd6f4" fill-opacity="0.6">изменить</text>
<text x="2484" y="5970" textLength="504" xml:space="preserve" fill="#cdd6f4" font-weight="bold">Пробел</text>
<text x="3072" y="5970" textLength="924" xml:space="preserve" fill="#cdd6f4" fill-opacity="0.6">переключить</text>
<text x="4164" y="5970" textLength="84" xml:space="preserve" fill="#cdd6f4" font-weight="bold">?</text>
<text x="4332" y="5970" textLength="588" xml:space="preserve" fill="#cdd6f4" fill-opacity="0.6">справка</text>
<text x="5088" y="5970" textLength="84" xml:space="preserve" fill="#cdd6f4" font-weight="bold">q</text>
<text x="5256" y="5970" textLength="420" xml:space="preserve" fill="#cdd6f4" fill-opacity="0.6">выход</text>
</g>
</svg>
