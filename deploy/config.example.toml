#:schema https://raw.githubusercontent.com/raycat-app/raycat/main/deploy/config.schema.json
# Настройки raycat: /etc/raycat/config.toml. В файле ссылка подписки, поэтому права 0600.
# После правки: sudo systemctl restart raycat
# Проверить файл и подписки: sudo raycat check
# Итоговые значения, как их видит raycat: sudo raycat config
# Все ключи: https://github.com/raycat-app/raycat#настройки

# ── Основное ─────────────────────────────────────────────────────────────

[[subscription]]
# Ссылка подписки от провайдера. Она работает как пароль: никому её не показывайте.
url = "https://example.com/sub/REPLACE-WITH-YOUR-LINK"
# Приложение, которое принимает провайдер: happ или incy.
app = "happ"
# Платформа: windows или android (для incy только android).
platform = "windows"
# Дополнительно (раскомментируйте строку, чтобы её изменить; после «=» значение по умолчанию):
# name = "main"                      # имя для команд; без имени: main, backup, 3, 4…
# url_file = "/run/secrets/raycat"   # ссылка из файла вместо url, например Docker secret
# allow_http = false                 # разрешить http:// для этой подписки
# seed = "слово"                     # своё устройство для этой подписки
# update_interval = "12h"            # как часто обновлять: от 10m до 30d
# allow = ["*Германия*"]             # только узлы, подходящие под маски
# deny = ["*Info*"]                  # узлы, которые не использовать
# priority = ["*NL*"]                # предпочтительные узлы, по порядку

# Резервная подписка: такой же блок целиком. Имя можно не задавать, по порядку станет backup.
# [[subscription]]
# url = "https://example.com/sub/SECOND-LINK"
# app = "happ"
# platform = "android"

[mode]
# proxy: прокси для программ этого сервера, HTTP и SOCKS5 на 127.0.0.1:7890.
# gateway: весь трафик сервера и его контейнеров идёт через VPN (нужны nftables и iproute2).
type = "proxy"
# Дополнительно:
# listen = "127.0.0.1:7890"          # адрес прокси, для type = "proxy"
# auth = "логин:пароль"              # вход в прокси; off: без пароля, только в доверенной сети
# auth_file = "/run/secrets/proxy"   # то же, но логин и пароль читаются из файла
# kill_switch = true                 # не пускать трафик мимо VPN, пока он недоступен
# lan = false                        # пускать устройства локальной сети через шлюз
# lan_interface = "br-lan"           # интерфейс устройств; по умолчанию интерфейс маршрута
# lan_subnets = ["192.168.1.0/24"]   # подсети устройств; по умолчанию подсети интерфейса

[routing]
# Российские домены и подсети идут напрямую, мимо VPN: банки, госуслуги и т. п.
ru_direct = false
# Дополнительно:
# provider = false                   # применять маршрутизацию, которую присылает провайдер

# ── Дополнительно ────────────────────────────────────────────────────────
# Отдельные таблицы. Раскомментируйте заголовок и нужные строки; сами таблицы выше
# уже настроены, их ключи меняются в их блоках.

# Выбор узла:
# [selection]
# check_url = "https://www.gstatic.com/generate_204"   # адрес для проверки узла
# check_interval = "30s"             # как часто проверять узлы: от 5s до 10m
# failures = 3                       # сколько проверок подряд без ответа делают узел недоступным
# switch_gain = "150ms"              # на сколько узел должен быть быстрее, чтобы переключиться
# return_delay = "5m"                # через сколько вернуться на приоритетный узел
# pin = "main/NL-1"                  # всегда использовать этот узел: «подписка/узел»

# Устройство, которое видит провайдер:
# [device]
# seed = "любое слово или фраза"     # одинаково на всех серверах; без него raycat создаёт сам
# machine_id = "00000000000000000000000000000000"   # готовый идентификатор из 32 символов
# hostname = "server"                # имя компьютера в заголовках; по умолчанию выбирает raycat
# model = "server"                   # модель устройства
# manufacturer = "generic"           # производитель
# os_version = "Linux"               # версия системы
# locale = "ru"                      # язык системы

# DNS-серверы, которыми пользуется raycat:
# [dns]
# resolvers = ["1.1.1.1", "8.8.8.8"]   # от 1 до 8 адресов

# Ядро xray:
# [xray]
# path = "/usr/libexec/raycat/xray"  # путь к исполняемому файлу
# memory_limit = "96MiB"             # лимит памяти: от 16MiB до 16GiB
# tcp_congestion = "auto"            # auto: BBR, если хост это позволяет; off; или имя алгоритма
# xhttp_connections = 4              # соединения XHTTP: от 1 до 16; не задано: как у провайдера

# Журнал:
# [log]
# level = "info"                     # error, warn, info или debug

# Свои правила маршрутизации: проверяются сверху вниз, применяется первое подошедшее.
# [[routing.rule]]
# domains = ["example.ru", "*.example.org"]   # example.ru: только это имя; *.example.org: и поддомены
# ips = ["203.0.113.0/24"]           # IPv4 или IPv6: подсеть или одиночный адрес
# action = "direct"                  # direct: мимо VPN; proxy: через VPN; block: заблокировать
