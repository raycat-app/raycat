[package]
name = "raycat-emulation"
description = "Эмуляция клиентов подписок: точные заголовки запроса и идентификатор устройства по профилям-данным"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
raycat-http.workspace = true
ring.workspace = true
serde.workspace = true
toml.workspace = true

[features]
# Инструмент обновления профилей по захватам (`update-profiles`): в бинарник raycat не попадает.
tool = []

[[bin]]
name = "update-profiles"
path = "src/bin/update-profiles.rs"
required-features = ["tool"]

[lints]
workspace = true
